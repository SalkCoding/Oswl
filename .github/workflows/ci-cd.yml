name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Djava.net.preferIPv4Stack=true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate release version, notes, and translation keys
        run: python3 .github/scripts/validate-release.py

      - name: Build, test, and verify production JAR
        run: ./gradlew --no-daemon clean test bootJar verifyProdJar

      - name: Check cluster result predicates without starting servers
        run: |
          python3 -m unittest discover -s scripts/verification -p test_cluster_assertions.py
          bash -n scripts/verification/verify-multi-instance.sh

      - name: Verify THIRD_PARTY_LICENSES.md version sync
        run: |
          ./gradlew --no-daemon syncThirdPartyLicenseVersions
          git diff --exit-code THIRD_PARTY_LICENSES.md

  ui:
    name: Browser smoke and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run browser checks
        run: ./gradlew --no-daemon uiTest --tests '*SmokeUiTest' --tests '*KeyboardFlowUiTest' --tests '*AxeAuditUiTest' --tests '*RequestLifecycleUiTest' --tests '*QuickImportSourceReachabilityUiTest' --tests '*SettingsModulesUiTest' --tests '*SettingsFailureUiTest' --tests '*UiStateMatrixUiTest' --tests '*OnboardingFailureUiTest' --tests '*DetectionCoverageUiTest' --tests '*EmbeddedAiFailureUiTest' --tests '*OrganizationWorkflowUiTest' --tests '*AuthExpiryUiTest'
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports
          path: build/reports/tests/uiTest

  publish:
    name: Publish tagged release
    needs: [build, ui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCKER_IMAGE: salk1104/oswl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Validate exact tag and prepare release notes
        run: python3 .github/scripts/validate-release.py --tag "$GITHUB_REF_NAME" --notes-output build/release-notes.md
      - name: Build production JAR
        run: ./gradlew --no-daemon bootJar verifyProdJar
      - name: Derive Docker image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare draft GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "repair_latest=false" >> "$GITHUB_OUTPUT"
          echo "reuse_image=false" >> "$GITHUB_OUTPUT"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > build/release-is-draft; then
            if [ "$(cat build/release-is-draft)" != "true" ]; then
              LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
              HAS_DIGEST="$(gh release view "$GITHUB_REF_NAME" --json assets \
                --jq '.assets | map(.name) | index("DOCKER_IMAGE_DIGEST") != null')"
              if [ "$LATEST_TAG" = "$GITHUB_REF_NAME" ] && [ "$HAS_DIGEST" = "true" ]; then
                echo "repair_latest=true" >> "$GITHUB_OUTPUT"
                echo "Release is already published; immutable assets will not be overwritten and latest will be verified."
              else
                echo "Release is already published; assets and Docker tags will not be overwritten."
              fi
              exit 0
            fi
            HAS_DIGEST="$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets | map(.name) | index("DOCKER_IMAGE_DIGEST") != null')"
            if [ "$HAS_DIGEST" = "true" ]; then
              echo "reuse_image=true" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "OsWL ${{ steps.version.outputs.version }}" --notes-file build/release-notes.md
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true' || steps.release.outputs.repair_latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: salk1104
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true' || steps.release.outputs.repair_latest == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push versioned Docker image
        id: docker
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.reuse_image != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record Docker image digest
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.reuse_image != 'true'
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$DOCKER_IMAGE" "${{ steps.docker.outputs.digest }}" > build/libs/DOCKER_IMAGE_DIGEST
      - name: Reuse Docker image from draft release
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.reuse_image == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern DOCKER_IMAGE_DIGEST --dir build/libs
      - name: Validate Docker image digest
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          IMAGE_REF="$(tr -d '\r\n' < build/libs/DOCKER_IMAGE_DIGEST)"
          if [[ ! "$IMAGE_REF" =~ ^salk1104/oswl@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Docker image digest: $IMAGE_REF" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE_REF" > /dev/null
          docker buildx imagetools create \
            --tag "$DOCKER_IMAGE:${{ steps.version.outputs.version }}" "$IMAGE_REF"
      - name: Publish JAR and checksum
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="build/libs/oswl-${VERSION}.jar"
          test -f "$JAR"
          (cd build/libs && sha256sum "oswl-${VERSION}.jar" > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" "$JAR" build/libs/SHA256SUMS build/libs/DOCKER_IMAGE_DIGEST --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Promote published image to latest
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          IMAGE_REF="$(tr -d '\r\n' < build/libs/DOCKER_IMAGE_DIGEST)"
          docker buildx imagetools create --tag "$DOCKER_IMAGE:latest" "$IMAGE_REF"
      - name: Repair latest after a partial previous run
        if: steps.release.outputs.repair_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/docker-release
          gh release download "$GITHUB_REF_NAME" --pattern DOCKER_IMAGE_DIGEST --dir build/docker-release
          IMAGE_REF="$(tr -d '\r\n' < build/docker-release/DOCKER_IMAGE_DIGEST)"
          if [[ ! "$IMAGE_REF" =~ ^salk1104/oswl@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Docker image digest: $IMAGE_REF" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$DOCKER_IMAGE:latest" "$IMAGE_REF"
