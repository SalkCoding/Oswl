name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Djava.net.preferIPv4Stack=true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate release version, notes, and translation keys
        run: python3 .github/scripts/validate-release.py

      - name: Build, test, and verify production JAR
        run: ./gradlew --no-daemon clean test bootJar verifyProdJar

      - name: Check cluster result predicates without starting servers
        run: |
          python3 -m unittest discover -s scripts/verification -p test_cluster_assertions.py
          bash -n scripts/verification/verify-multi-instance.sh

      - name: Verify THIRD_PARTY_LICENSES.md version sync
        run: |
          ./gradlew --no-daemon syncThirdPartyLicenseVersions
          git diff --exit-code THIRD_PARTY_LICENSES.md

  ui:
    name: Browser smoke and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run browser checks
        run: ./gradlew --no-daemon uiTest --tests '*SmokeUiTest' --tests '*KeyboardFlowUiTest' --tests '*AxeAuditUiTest' --tests '*RequestLifecycleUiTest' --tests '*QuickImportSourceReachabilityUiTest' --tests '*SettingsModulesUiTest' --tests '*SettingsFailureUiTest' --tests '*UiStateMatrixUiTest' --tests '*OnboardingFailureUiTest' --tests '*DetectionCoverageUiTest' --tests '*EmbeddedAiFailureUiTest' --tests '*OrganizationWorkflowUiTest' --tests '*AuthExpiryUiTest'
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports
          path: build/reports/tests/uiTest

  publish:
    name: Publish tagged release
    needs: [build, ui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Validate exact tag and prepare release notes
        run: python3 .github/scripts/validate-release.py --tag "$GITHUB_REF_NAME" --notes-output build/release-notes.md
      - name: Build production JAR
        run: ./gradlew --no-daemon bootJar verifyProdJar
      - name: Publish JAR and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="build/libs/oswl-${VERSION}.jar"
          test -f "$JAR"
          (cd build/libs && sha256sum "oswl-${VERSION}.jar" > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > build/release-is-draft; then
            if [ "$(cat build/release-is-draft)" != "true" ]; then
              echo "Release is already published; existing assets will not be overwritten."
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "OsWL ${VERSION}" --notes-file build/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$JAR" build/libs/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
