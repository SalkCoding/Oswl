name: Sync Docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/en/**'
      - '.github/scripts/prepare-wiki.py'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the Wiki commit without publishing'
        type: boolean
        default: true

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare English Wiki pages
        env:
          WIKI_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/prepare-wiki.py "$WIKI_REPOSITORY"

      - name: Sync to GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5.0.4
        with:
          path: build/wiki/
          strategy: clone
          preprocess: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          disable-empty-commits: true
          commit-message: "wiki: sync from ${{ github.sha }}"
