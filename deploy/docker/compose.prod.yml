# Preserve the original Oswl checkout project name; -p / COMPOSE_PROJECT_NAME can override it.
name: oswl
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    # Cap container log growth (docker itself, not the app's own file log below).
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../../.env.prod
    environment:
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      OSWL_ENCRYPTION_KEY: "${OSWL_ENCRYPTION_KEY}"
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_ADDRESS: "${SERVER_ADDRESS:-127.0.0.1}"
      JAVA_OPTS: "-Xms512m -Xmx1g"
      SPRING_MAIL_HOST: "${SMTP_HOST}"
      SPRING_MAIL_PORT: "${SMTP_PORT}"
      SPRING_MAIL_USERNAME: "${SMTP_USER}"
      SPRING_MAIL_PASSWORD: "${SMTP_PASS}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      # Rotating file log inside the container, mounted to a named volume below so
      # it survives container recreation. OSWL_LOG_JSON opt-in via .env.prod (default false).
      OSWL_LOG_DIR: "/var/log/oswl"
      OSWL_LOG_JSON: "${OSWL_LOG_JSON:-false}"
    volumes:
      - oswl-logs-prod:/var/log/oswl
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    # Cap container stdout/stderr log growth (separate from the OSWL_LOG_DIR file
    # log above — this is docker's own capture of the process's console output).
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  db-data-prod:
  oswl-logs-prod:
