spring:
  config:
    activate:
      on-profile: uitest

  datasource:
    url: "jdbc:h2:mem:uitest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS TEXT"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 3025

  thymeleaf:
    cache: false

oswl:
  encryption:
    key: "dGVzdC1rZXktMzItYnl0ZXMtZm9yLXRlc3QtMDEyMzQ="
  monitoring:
    enabled: false
  ai:
    embedded:
      auto-download-on-boot: false
