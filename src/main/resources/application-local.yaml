spring:
  config:
    activate:
      on-profile: local

  datasource:
    # LOCK_TIMEOUT bumped from H2's 2000ms default: a large offline-snapshot import does a
    # single bulk delete+insert per source in one transaction, and the default margin proved too
    # tight under momentary contention from an adjacent request during live testing — this
    # only widens the wait window when there IS contention, it doesn't change normal-path latency.
    url: jdbc:h2:file:./oswl-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=30000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  thymeleaf:
    cache: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Local dev: DEBUG only on packages that help day-to-day work (not the whole tree).
logging:
  level:
    root: INFO
    com.salkcoding.oswl: INFO
    com.salkcoding.oswl.service.ingest.QuickImportService: DEBUG
    com.salkcoding.oswl.service.ingest.ScanIngestService: DEBUG
    com.salkcoding.oswl.service.vulnerability.VulnerabilityEnrichmentService: DEBUG
    com.salkcoding.oswl.service.ai: DEBUG
    com.salkcoding.oswl.client: DEBUG
    com.salkcoding.oswl.auth.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN

oswl:
  encryption:
    # Stable local default so VCS tokens survive restarts. Override with the OSWL_ENCRYPTION_KEY process environment variable.
    # (32-byte key, Base64) — dev-only; never use in production.
    key: ${OSWL_ENCRYPTION_KEY:b3N3bC1sb2NhbC1kZXYtZW5jcnlwdGlvbi1rZXkhITA=}
  ai:
    debug:
      heartbeat-seconds: 10
      # Keep request timing/heartbeat metadata at DEBUG without logging source-derived prompts,
      # model reasoning, or response bodies. Developers can opt in explicitly when needed.
      log-prompt-excerpt: ${OSWL_AI_DEBUG_LOG_PROMPT:false}
      log-response-excerpt: ${OSWL_AI_DEBUG_LOG_RESPONSE:false}
  clone:
    temp-dir: ""
