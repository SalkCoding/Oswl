# OsWL AI prompt templates (English default)
# Placeholders: {name} — replaced at runtime by AiPromptTemplateService

# ── Model parameters ─────────────────────────────────────────────────
params.temperature=0.15
params.maxTokens=1200

# ── System (provider-specific overrides fall back to system.default) ───
system.default=You are a senior application security engineer triaging software supply chain findings for a development team.\nRules:\n- Use ONLY the data provided in the user message. Never invent CVE IDs, CVSS scores, EPSS values, version numbers, or license terms.\n- A field shown as "-", "unknown" or "none" means the data is unavailable. Say so plainly; do not guess a value and do not pad the answer to hide the gap.\n- When fixVersion is present, name that exact version in the recommendation. When it is absent, recommend a mitigation instead of an upgrade.\n- Weight exploitability signals in this order: KEV listed > high EPSS > CVSS score. A KEV-listed medium beats a theoretical critical.\n- Prefer one concrete next step over a list of generic warnings. Say what to do, not that something "should be reviewed".\n- Write for a developer who has not read the advisory: name the affected behaviour, not just the CWE class.\n- For batch tasks, return ONLY valid JSON matching the requested schema — no markdown fences, no commentary before or after.\nFor non-batch (free-text) questions, reply in plain prose only: no JSON, no brackets, no markdown.

system.openai=You are a senior application security engineer. Return ONLY valid JSON for batch tasks with no markdown fences. Use ONLY provided fields. Be concise.\nFor non-batch (free-text) questions, reply in plain prose only: no JSON, no brackets, no markdown.

system.anthropic=You are a senior application security engineer triaging supply chain risk. For batch tasks output ONLY a JSON array. Never wrap JSON in markdown code blocks.\nFor non-batch (free-text) questions, reply in plain prose only: no JSON, no brackets, no markdown.

system.gemini=You are a senior application security engineer. Batch responses must be a single JSON array only, no extra prose.\nFor non-batch (free-text) questions, reply in plain prose only: no JSON, no brackets, no markdown.

system.local=You are a senior application security engineer. For batch tasks respond with ONLY valid JSON (no markdown).\nFor non-batch (free-text) questions, reply in plain prose only: no JSON, no brackets, no markdown.

# ── Single-item prompts ──────────────────────────────────────────────
cve.single=Assess {cveId} (severity: {severity}, CVSS: {cvssScore}) in component {component}.\nTitle: {title}\nOSV summary: {osvSummary}\nFix version: {fixVersion}\nCWE: {cweId}\nCVSS vector: {cvssVector}\nDependency: {dependencyType}\nPatchability: {patchability}\n\nIn 2-3 short sentences: (1) practical impact for developers, (2) exploitability hint, (3) recommended action with version if available.

cve.single.withType=Assess {cveId} (severity: {severity}, CVSS: {cvssScore}, type: {cveType}) in component {component}.\nTitle: {title}\nOSV summary: {osvSummary}\nFix version: {fixVersion}\nCWE: {cweId}\nDependency: {dependencyType}\n\nIn 2-3 short sentences: impact, exploitability, and recommended action.

security.trend=Project '{projectName}' across versions [{recentVersions}]: security issues {securityDirection} by {securityDelta}.\n\nChange details:\n{changeDetails}\n\nWrite 2-3 sentences: trend interpretation, biggest new risks if any, and ONE prioritized remediation action.

license.trend=Project '{projectName}' across versions [{recentVersions}]: license-risk components {licenseDirection} by {licenseDelta}.\n\nChange details:\n{changeDetails}\n\nWrite 2-3 sentences: compliance trend, newly risky licenses/components, and ONE concrete compliance action.

license.single=License '{licenseName}' (status: {licenseStatus}) on component '{component}' ({ecosystem}, {dependencyType}). Latest version info: {latestVersion}.\n\nIn 2-3 sentences: the obligation this license actually triggers, whether a {dependencyType} dependency changes that exposure, and ONE recommended action (approve, add attribution, review with legal, replace, or isolate). If the license is unrecognised, say so rather than guessing its terms.

security.posture=Project '{projectName}' scan snapshot:\n- Components: {totalComponents}\n- CVEs — Critical: {critical}, High: {high}, Medium: {medium}, Low: {low}\n- Patchable libraries: {patchableCount}, Non-patchable: {nonPatchableCount}\n- Direct dependencies with Critical/High CVEs: {directCriticalHigh}\nTop issues:\n{topIssues}\n\nSummarize security posture in 2-3 sentences and name the single highest-priority action.

version.diff=Project '{projectName}' changed from '{fromVersion}' to '{toVersion}':\n- Added: {added}, Removed: {removed}, Updated: {updated}, New threats: {newThreats}\n\nNotable changes:\n{threatDetails}\n\nIn 2-3 sentences: security impact of this release and the most urgent follow-up.

test.connection=Reply with only the word OK.

# ── Batch prompts (enrichment) ───────────────────────────────────────
batch.cve.header=Project deployment context: {deploymentProfile}.\nFor each item below, produce a triage note using ONLY the provided fields.\n\nReturn ONLY a JSON array — no markdown fences, no text before or after:\n[{"id":"...","summary":"impact in one sentence","recommendedAction":"concrete next step","priority":"P0|P1|P2|P3"}]\n\nRules:\n- Emit exactly one object per input item, reusing each id verbatim. Do not merge, reorder, skip, or invent items.\n- Priority: P0 = KEV-listed or trivially exploitable from untrusted input, fix now. P1 = critical/high severity on a reachable direct dependency. P2 = real but mitigated by low EPSS, transitive-only reach, or limited exposure in this deployment context. P3 = informational, no practical impact here.\n- summary: the concrete consequence for this component (what an attacker gains), not a restatement of the severity.\n- recommendedAction: name the exact fix version when fixVersion is given; otherwise give a specific mitigation.\n- Keep summary to 120 characters or fewer and recommendedAction to 100 characters or fewer, so the array is not truncated.\n\nItems:
batch.cve.item={index}. id={id} component={component} severity={severity} cvss={cvssScore} epss={epss} kev={kevListed} title={title} osvSummary={osvSummary} fixVersion={fixVersion} cwe={cweId} vector={cvssVector} dependency={dependencyType} patchability={patchability}

batch.license.header=Distribution context: {deploymentProfile}. Assess each license item below for THAT context using ONLY the provided data — obligations differ sharply between an internal tool, a network service, and distributed software.\n\nReturn ONLY a JSON array — no markdown fences, no text before or after:\n[{"id":"...","summary":"risk in one sentence","recommendedAction":"concrete next step","priority":"P0|P1|P2|P3"}]\n\nRules:\n- Emit exactly one object per input item, reusing each id verbatim. Do not merge, reorder, skip, or invent items.\n- Priority: P0 = obligation that blocks shipping in this context (e.g. strong copyleft in distributed software). P1 = requires legal sign-off before release. P2 = attribution or notice obligation to satisfy. P3 = permissive, no action beyond record-keeping.\n- summary: the actual obligation triggered in this context, not a description of the license family.\n- recommendedAction: one of approve, add attribution, review with legal, replace, or isolate — with the reason.\n- Say explicitly when a license is unrecognised rather than guessing its terms.\n- Keep summary to 120 characters or fewer and recommendedAction to 100 characters or fewer, so the array is not truncated.\n\nItems:
batch.license.item={index}. id={id} license={licenseName} status={licenseStatus} policyReason={policyReason} component={component} ecosystem={ecosystem} dependency={dependencyType} latestVersion={latestVersion}
