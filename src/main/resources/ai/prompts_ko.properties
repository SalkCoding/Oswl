# OsWL AI prompt templates (Korean overlay — keys here override prompts.properties when oswl.ai.prompts.locale=ko)

# ── Model parameters ─────────────────────────────────────────────────
params.temperature=0.15
params.maxTokens=1200
params.maxTokens.security.posture=256
params.maxTokens.security.trend=256
params.maxTokens.license.trend=256
params.maxTokens.version.diff=256
params.maxTokens.batch.cve=2048
params.maxTokens.batch.license=1536
params.maxTokens.insights.combined=900

# ── System ───────────────────────────────────────────────────────────
system.default=당신은 개발팀을 위한 소프트웨어 공급망 보안 트리아지를 수행하는 시니어 애플리케이션 보안 엔지니어입니다.\n규칙:\n- 사용자 메시지에 제공된 데이터만 사용하세요. CVE ID, CVSS 점수, EPSS 값, 버전 번호, 라이선스 조건을 지어내지 마세요.\n- "-", "unknown", "none"으로 표시된 필드는 데이터가 없다는 뜻입니다. 없다고 분명히 밝히고, 값을 추측하거나 빈틈을 감추려 말을 늘리지 마세요.\n- fixVersion이 있으면 그 버전을 정확히 지목해 권장하세요. 없으면 업그레이드 대신 완화 방안을 제시하세요.\n- 악용 가능성은 KEV 등재 > 높은 EPSS > CVSS 점수 순으로 가중하세요. KEV에 등재된 Medium이 이론상의 Critical보다 우선합니다.\n- 일반적인 경고를 나열하지 말고 구체적인 다음 단계 하나를 제시하세요. "검토가 필요하다"가 아니라 무엇을 할지 쓰세요.\n- 어드바이저리를 읽지 않은 개발자를 대상으로, CWE 분류가 아니라 실제로 문제되는 동작을 설명하세요.\n- 배치 작업은 요청된 JSON 스키마만 반환하세요. 마크다운 코드펜스나 앞뒤 설명을 붙이지 마세요.\n- 모든 응답은 한국어로 작성하세요.\n- 배치가 아닌 일반 질문에는 JSON, 대괄호, 마크다운 없이 순수한 문장으로만 답하세요.

system.openai=당신은 시니어 애플리케이션 보안 엔지니어입니다. 배치 작업은 마크다운 없이 유효한 JSON만 반환하세요. 제공된 필드만 사용하고 간결하게 한국어로 작성하세요. 배치가 아닌 일반 질문에는 JSON, 대괄호, 마크다운 없이 순수한 문장으로만 답하세요.

system.anthropic=당신은 공급망 위험을 트리아지하는 시니어 애플리케이션 보안 엔지니어입니다. 배치 작업은 JSON 배열만 출력하고 코드 블록으로 감싸지 마세요. 한국어로 응답하세요. 배치가 아닌 일반 질문에는 JSON, 대괄호, 마크다운 없이 순수한 문장으로만 답하세요.

system.gemini=당신은 시니어 애플리케이션 보안 엔지니어입니다. 배치 응답은 단일 JSON 배열만 반환하고 추가 설명은 금지합니다. 한국어로 작성하세요. 배치가 아닌 일반 질문에는 JSON, 대괄호, 마크다운 없이 순수한 문장으로만 답하세요.

system.local=당신은 시니어 애플리케이션 보안 엔지니어입니다. 배치 작업은 마크다운 없이 유효한 JSON만 반환하세요. 한국어로 작성하세요. 배치가 아닌 일반 질문에는 JSON, 대괄호, 마크다운 없이 순수한 문장으로만 답하세요.

# ── Single-item prompts ──────────────────────────────────────────────
cve.single={cveId} (심각도: {severity}, CVSS: {cvssScore}) — 컴포넌트 {component}.\n제목: {title}\nOSV 요약: {osvSummary}\n수정 버전: {fixVersion}\nCWE: {cweId}\nCVSS 벡터: {cvssVector}\n의존성: {dependencyType}\n패치 가능: {patchability}\n\n2-3문장으로: (1) 개발자 관점 실무 영향, (2) 악용 가능성, (3) 버전 포함 권장 조치.

cve.single.withType={cveId} (심각도: {severity}, CVSS: {cvssScore}, 유형: {cveType}) — 컴포넌트 {component}.\n제목: {title}\nOSV 요약: {osvSummary}\n수정 버전: {fixVersion}\nCWE: {cweId}\n의존성: {dependencyType}\n\n2-3문장으로: 영향, 악용 가능성, 권장 조치.

security.trend=프로젝트 '{projectName}', 버전 [{recentVersions}]: 보안 이슈 {securityDelta}건 {securityDirection}.\n\n변경 상세:\n{changeDetails}\n\n2-3문장: 트렌드 해석, 새로운 주요 위험, 우선 조치 1개.

license.trend=프로젝트 '{projectName}', 버전 [{recentVersions}]: 라이선스 위험 컴포넌트 {licenseDelta}건 {licenseDirection}.\n\n변경 상세:\n{changeDetails}\n\n2-3문장: 컴플라이언스 트렌드, 새 위험 라이선스/컴포넌트, 구체 액션 1개.

license.single=라이선스 '{licenseName}' (상태: {licenseStatus}) — 컴포넌트 '{component}' ({ecosystem}, {dependencyType}). 최신 버전: {latestVersion}.\n\n2-3문장으로: 이 라이선스가 실제로 발생시키는 의무, {dependencyType} 의존성이라는 점이 노출도에 미치는 영향, 그리고 권장 조치 1개(승인 / 고지 추가 / 법무 검토 / 교체 / 격리)를 제시하세요. 알 수 없는 라이선스라면 조건을 추측하지 말고 모른다고 명시하세요.

security.posture=프로젝트 '{projectName}' 스캔 현황:\n- 컴포넌트: {totalComponents}개\n- CVE — Critical: {critical}, High: {high}, Medium: {medium}, Low: {low}\n- 패치 가능 라이브러리: {patchableCount}, 불가: {nonPatchableCount}\n- Critical/High CVE가 있는 직접 의존성: {directCriticalHigh}개\n주요 이슈:\n{topIssues}\n\n보안 포스처 2-3문장 요약과 최우선 조치 1개.

version.diff=프로젝트 '{projectName}' '{fromVersion}' → '{toVersion}':\n- 추가 {added}, 제거 {removed}, 업데이트 {updated}, 신규 위협 {newThreats}\n\n주요 변경:\n{threatDetails}\n\n2-3문장: 릴리스 보안 영향과 긴급 후속 조치.

# F2: posture + 보안 트렌드 + 라이선스 트렌드 + 버전 diff를 하나의 JSON 호출로 통합. 이전 완료 스캔이
# 있을 때 사용(AiPromptTemplateService.combinedInsightsPrompt, hasHistory=true).
insights.combined.full=이 프로젝트 스캔을 분석해 오직 JSON 객체만 응답하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n{"posture":"...","securityTrend":"...","licenseTrend":"...","versionDiff":"..."}\n\n각 필드는 마크다운·목록 없이 순수 문장 2-3문장입니다:\n- posture: 전체 보안 포스처 요약과 최우선 조치 1개.\n- securityTrend: 아래 보안 데이터 기반 트렌드 해석, 새로운 주요 위험(있다면), 우선 조치 1개.\n- licenseTrend: 아래 라이선스 데이터 기반 컴플라이언스 트렌드, 새 위험 라이선스/컴포넌트(있다면), 구체 액션 1개.\n- versionDiff: 아래 버전 변경의 보안 영향과 가장 긴급한 후속 조치.\n\n프로젝트 '{projectName}' 스캔 현황:\n- 컴포넌트: {totalComponents}개\n- CVE — Critical: {critical}, High: {high}, Medium: {medium}, Low: {low}\n- 패치 가능 라이브러리: {patchableCount}, 불가: {nonPatchableCount}\n- Critical/High CVE가 있는 직접 의존성: {directCriticalHigh}개\n주요 이슈:\n{topIssues}\n\n버전 [{recentVersions}]에 걸쳐: 보안 이슈 {securityDelta}건 {securityDirection}; 라이선스 위험 컴포넌트 {licenseDelta}건 {licenseDirection}.\n보안 변경 상세:\n{secChangeDetails}\n라이선스 변경 상세:\n{licChangeDetails}\n\n버전 변경 '{fromVersion}' → '{toVersion}': 추가 {added}, 제거 {removed}, 업데이트 {updated}, 신규 위협 {newThreats}.\n주요 변경:\n{threatDetails}

# F2: 이전 완료 스캔이 없는 첫 스캔용 축소 스키마 — trend/diff 섹션을 아예 빼서 모델이 근거 없이
# "변화 없음" 서술을 지어내는 것을 막는다.
insights.combined.postureOnly=이 프로젝트 스캔을 분석해 오직 JSON 객체만 응답하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n{"posture":"..."}\n\n이 필드는 마크다운·목록 없이 순수 문장 2-3문장입니다: 전체 보안 포스처 요약과 최우선 조치 1개.\n\n프로젝트 '{projectName}' 스캔 현황:\n- 컴포넌트: {totalComponents}개\n- CVE — Critical: {critical}, High: {high}, Medium: {medium}, Low: {low}\n- 패치 가능 라이브러리: {patchableCount}, 불가: {nonPatchableCount}\n- Critical/High CVE가 있는 직접 의존성: {directCriticalHigh}개\n주요 이슈:\n{topIssues}

test.connection=OK라는 단어만 응답하세요.

# ── Batch prompts (enrichment) ───────────────────────────────────────
batch.cve.header=아래 항목마다 제공된 필드만 사용해 트리아지 노트를 작성하세요.\n\nJSON 배열만 반환하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n[{"id":"...","summary":"영향 한 문장","recommendedAction":"구체 조치","priority":"P0|P1|P2|P3"}]\n\n규칙:\n- 입력 항목당 정확히 객체 1개를 만들고 id를 그대로 사용하세요. 항목을 합치거나 순서를 바꾸거나 빠뜨리거나 새로 만들지 마세요.\n- 우선순위: P0 = KEV 등재 또는 신뢰할 수 없는 입력으로 쉽게 악용 가능, 즉시 조치. P1 = 도달 가능한 직접 의존성의 Critical/High. P2 = 실재하지만 낮은 EPSS·전이 의존성·아래 제시되는 프로젝트 배포 맥락에서의 제한된 노출로 완화됨. P3 = 참고 수준, 실질적 영향 없음.\n- summary: 심각도를 되풀이하지 말고, 이 컴포넌트에서 발생하는 구체적 결과(공격자가 얻는 것)를 쓰세요.\n- recommendedAction: fixVersion이 있으면 그 버전을 정확히 지목하고, 없으면 구체적 완화 방안을 쓰세요.\n- 배열이 잘리지 않도록 summary는 120자 이내, recommendedAction은 100자 이내로 작성하세요.\n\n프로젝트 배포 맥락: {deploymentProfile}.\n\n항목:
batch.cve.item={index}. id={id} component={component} severity={severity} cvss={cvssScore} epss={epss} kev={kevListed} title={title} osvSummary={osvSummary} fixVersion={fixVersion} cwe={cweId} vector={cvssVector} dependency={dependencyType} patchability={patchability}

batch.cve.header.local=아래 항목마다 제공된 필드만 사용해 짧은 트리아지 노트를 작성하세요.\n\nJSON 배열만 반환하세요. 항목마다 정확히 객체 1개, 순서는 그대로 — 마크다운이나 추가 설명 금지:\n[{"id":"...","summary":"...","priority":"P0|P1|P2|P3"}]\n\n우선순위: P0/P1 = 즉시 조치(KEV 등재, 또는 직접 의존성의 Critical/High). P2/P3 = 낮은 긴급도(전이 의존성, 낮은 EPSS, 또는 참고 수준).\nsummary: 짧은 한 문장 — 공격자가 얻는 것, fixVersion이 있으면 그 버전을 명시하세요.\n\n예시:\n입력: id=CVE-2024-1234 severity=CRITICAL kev=yes fixVersion=2.1.0\n출력: {"id":"CVE-2024-1234","summary":"원격 공격자가 임의 코드를 실행할 수 있음; 2.1.0으로 업그레이드하세요.","priority":"P0"}\n\n프로젝트 배포 맥락: {deploymentProfile}.\n\n항목:

# F3: 클라우드 전용 압축 변형 — 필드 라벨 대신 파이프로 구분된 한 줄.
batch.cve.header.compact=아래 항목마다 제공된 필드만 사용해 트리아지 노트를 작성하세요.\n\n각 항목은 다음 순서의 파이프(|) 구분 한 줄입니다:\nid|component|severity|cvssScore|epss|kevListed|title|osvSummary|fixVersion|cweId|cvssVector|dependencyType|patchability\n값이 없는 필드는 파이프 사이를 비워 둡니다.\n\nJSON 배열만 반환하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n[{"id":"...","summary":"영향 한 문장","recommendedAction":"구체 조치","priority":"P0|P1|P2|P3"}]\n\n규칙:\n- 입력 줄마다 정확히 객체 1개를 만들고 id를 그대로 사용하세요. 항목을 합치거나 순서를 바꾸거나 빠뜨리거나 새로 만들지 마세요.\n- 우선순위: P0 = KEV 등재 또는 신뢰할 수 없는 입력으로 쉽게 악용 가능, 즉시 조치. P1 = 도달 가능한 직접 의존성의 Critical/High. P2 = 실재하지만 낮은 EPSS·전이 의존성·아래 제시되는 프로젝트 배포 맥락에서의 제한된 노출로 완화됨. P3 = 참고 수준, 실질적 영향 없음.\n- summary: 심각도를 되풀이하지 말고, 이 컴포넌트에서 발생하는 구체적 결과(공격자가 얻는 것)를 쓰세요.\n- recommendedAction: fixVersion이 있으면 그 버전을 정확히 지목하고, 없으면 구체적 완화 방안을 쓰세요.\n- 배열이 잘리지 않도록 summary는 120자 이내, recommendedAction은 100자 이내로 작성하세요.\n\n프로젝트 배포 맥락: {deploymentProfile}.\n\n항목:
batch.cve.item.compact={id}|{component}|{severity}|{cvssScore}|{epss}|{kevListed}|{title}|{osvSummary}|{fixVersion}|{cweId}|{cvssVector}|{dependencyType}|{patchability}

batch.license.header=아래 라이선스 항목을 제공된 데이터만으로 평가하세요 — 사내 도구, 네트워크 서비스, 배포되는 소프트웨어는 의무가 크게 다르며, 이 프로젝트의 배포 맥락은 아래에 제시됩니다.\n\nJSON 배열만 반환하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n[{"id":"...","summary":"위험 한 문장","recommendedAction":"구체 조치","priority":"P0|P1|P2|P3"}]\n\n규칙:\n- 입력 항목당 정확히 객체 1개를 만들고 id를 그대로 사용하세요. 항목을 합치거나 순서를 바꾸거나 빠뜨리거나 새로 만들지 마세요.\n- 우선순위: P0 = 이 맥락에서 출시를 막는 의무(예: 배포 소프트웨어의 강한 카피레프트). P1 = 출시 전 법무 승인 필요. P2 = 고지·저작권 표시 의무 이행 필요. P3 = 허용적, 기록 관리 외 조치 불필요.\n- summary: 라이선스 계열에 대한 설명이 아니라, 이 맥락에서 실제로 발생하는 의무를 쓰세요.\n- recommendedAction: 승인 / 고지 추가 / 법무 검토 / 교체 / 격리 중 하나를 이유와 함께 제시하세요.\n- 알 수 없는 라이선스는 조건을 추측하지 말고 모른다고 명시하세요.\n- 배열이 잘리지 않도록 summary는 120자 이내, recommendedAction은 100자 이내로 작성하세요.\n\n배포 맥락: {deploymentProfile}.\n\n항목:
batch.license.item={index}. id={id} license={licenseName} status={licenseStatus} policyReason={policyReason} component={component} ecosystem={ecosystem} dependency={dependencyType} latestVersion={latestVersion}

# F3: 클라우드 전용 압축 변형 (근거는 위 batch.cve.header.compact 참고).
batch.license.header.compact=아래 라이선스 항목을 제공된 데이터만으로 평가하세요 — 사내 도구, 네트워크 서비스, 배포되는 소프트웨어는 의무가 크게 다르며, 이 프로젝트의 배포 맥락은 아래에 제시됩니다.\n\n각 항목은 다음 순서의 파이프(|) 구분 한 줄입니다:\nid|licenseName|licenseStatus|policyReason|component|ecosystem|dependencyType|latestVersion\n값이 없는 필드는 파이프 사이를 비워 둡니다.\n\nJSON 배열만 반환하세요 — 마크다운 코드펜스나 앞뒤 설명 금지:\n[{"id":"...","summary":"위험 한 문장","recommendedAction":"구체 조치","priority":"P0|P1|P2|P3"}]\n\n규칙:\n- 입력 줄마다 정확히 객체 1개를 만들고 id를 그대로 사용하세요. 항목을 합치거나 순서를 바꾸거나 빠뜨리거나 새로 만들지 마세요.\n- 우선순위: P0 = 이 맥락에서 출시를 막는 의무(예: 배포 소프트웨어의 강한 카피레프트). P1 = 출시 전 법무 승인 필요. P2 = 고지·저작권 표시 의무 이행 필요. P3 = 허용적, 기록 관리 외 조치 불필요.\n- summary: 라이선스 계열에 대한 설명이 아니라, 이 맥락에서 실제로 발생하는 의무를 쓰세요.\n- recommendedAction: 승인 / 고지 추가 / 법무 검토 / 교체 / 격리 중 하나를 이유와 함께 제시하세요.\n- 알 수 없는 라이선스는 조건을 추측하지 말고 모른다고 명시하세요.\n- 배열이 잘리지 않도록 summary는 120자 이내, recommendedAction은 100자 이내로 작성하세요.\n\n배포 맥락: {deploymentProfile}.\n\n항목:
batch.license.item.compact={id}|{licenseName}|{licenseStatus}|{policyReason}|{component}|{ecosystem}|{dependencyType}|{latestVersion}

batch.license.header.local=아래 라이선스 항목을 제공된 데이터만으로 평가하세요.\n\nJSON 배열만 반환하세요. 항목마다 정확히 객체 1개, 순서는 그대로 — 마크다운이나 추가 설명 금지:\n[{"id":"...","summary":"...","priority":"P0|P1|P2|P3"}]\n\n우선순위: P0/P1 = 출시 전 조치 필요(강한 카피레프트, 또는 법무 승인 필요). P2/P3 = 낮은 긴급도(고지 표시만, 또는 허용적).\nsummary: 실제 발생하는 의무와 권장 조치(승인 / 고지 추가 / 법무 검토 / 교체 / 격리)를 짧은 한 문장으로 쓰세요.\n\n예시:\n입력: id=L42 license=GPL-3.0 status=RESTRICTED\n출력: {"id":"L42","summary":"강한 카피레프트 — 배포 전 교체하거나 별도 프로세스로 격리하세요.","priority":"P0"}\n\n배포 맥락: {deploymentProfile}.\n\n항목:
