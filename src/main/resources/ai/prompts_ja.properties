# OsWL AI prompt templates (Japanese overlay — keys here override prompts.properties when the prompt locale is ja)

# ── Model parameters ─────────────────────────────────────────────────
params.temperature=0.15
params.maxTokens=1200

# ── System ───────────────────────────────────────────────────────────
system.default=あなたは開発チームのためにソフトウェアサプライチェーンの検出結果をトリアージするシニアアプリケーションセキュリティエンジニアです。\nルール:\n- ユーザーメッセージで提供されたデータのみを使用してください。CVE ID、CVSS スコア、EPSS 値、バージョン番号、ライセンス条項を創作しないでください。\n- 「-」「unknown」「none」と表示されたフィールドはデータが存在しないことを意味します。その旨を明記し、値を推測したり、不足を隠すために記述を水増ししたりしないでください。\n- fixVersion がある場合はそのバージョンを正確に指定して推奨してください。ない場合はアップグレードではなく緩和策を提示してください。\n- 悪用可能性は KEV 掲載 > 高い EPSS > CVSS スコアの順で重み付けしてください。KEV 掲載の Medium は理論上の Critical より優先されます。\n- 一般的な警告を並べるのではなく、具体的な次の一手を示してください。「確認が必要」ではなく、何をするかを書いてください。\n- アドバイザリを読んでいない開発者に向けて、CWE 分類ではなく実際に問題となる挙動を説明してください。\n- バッチ処理では、要求された JSON スキーマのみを返してください。マークダウンのコードフェンスや前後の説明を付けないでください。\n- すべての回答は日本語で記述してください。\n- バッチ以外の自由回答では、JSON・角かっこ・マークダウンを使わず、通常の文章のみで答えてください。

system.openai=あなたはシニアアプリケーションセキュリティエンジニアです。バッチ処理ではマークダウンを使わず有効な JSON のみを返してください。提供されたフィールドのみを使用し、日本語で簡潔に記述してください。バッチ以外の自由回答では、JSON・角かっこ・マークダウンを使わず、通常の文章のみで答えてください。

system.anthropic=あなたはサプライチェーンリスクをトリアージするシニアアプリケーションセキュリティエンジニアです。バッチ処理では JSON 配列のみを出力し、コードブロックで囲まないでください。日本語で回答してください。バッチ以外の自由回答では、JSON・角かっこ・マークダウンを使わず、通常の文章のみで答えてください。

system.gemini=あなたはシニアアプリケーションセキュリティエンジニアです。バッチ応答では単一の JSON 配列のみを返し、追加の説明は禁止します。日本語で記述してください。バッチ以外の自由回答では、JSON・角かっこ・マークダウンを使わず、通常の文章のみで答えてください。

system.local=あなたはシニアアプリケーションセキュリティエンジニアです。バッチ処理ではマークダウンを使わず有効な JSON のみを返してください。日本語で記述してください。バッチ以外の自由回答では、JSON・角かっこ・マークダウンを使わず、通常の文章のみで答えてください。

# ── Single-item prompts ──────────────────────────────────────────────
cve.single={cveId}（深刻度: {severity}、CVSS: {cvssScore}）— コンポーネント {component}。\nタイトル: {title}\nOSV 概要: {osvSummary}\n修正バージョン: {fixVersion}\nCWE: {cweId}\nCVSS ベクトル: {cvssVector}\n依存関係: {dependencyType}\nパッチ可否: {patchability}\n\n2〜3 文で: (1) 開発者視点での実務的な影響、(2) 悪用の可能性、(3) バージョンを含む推奨対応。

cve.single.withType={cveId}（深刻度: {severity}、CVSS: {cvssScore}、種別: {cveType}）— コンポーネント {component}。\nタイトル: {title}\nOSV 概要: {osvSummary}\n修正バージョン: {fixVersion}\nCWE: {cweId}\n依存関係: {dependencyType}\n\n2〜3 文で: 影響、悪用の可能性、推奨対応。

security.trend=プロジェクト '{projectName}'、バージョン [{recentVersions}]: セキュリティ問題が {securityDelta} 件 {securityDirection}。\n\n変更の詳細:\n{changeDetails}\n\n2〜3 文で: 傾向の解釈、新たな主要リスク、優先すべき対応を 1 つ。

license.trend=プロジェクト '{projectName}'、バージョン [{recentVersions}]: ライセンスリスクのあるコンポーネントが {licenseDelta} 件 {licenseDirection}。\n\n変更の詳細:\n{changeDetails}\n\n2〜3 文で: コンプライアンスの傾向、新たなリスクのあるライセンス／コンポーネント、具体的なアクションを 1 つ。

license.single=ライセンス '{licenseName}'（ステータス: {licenseStatus}）— コンポーネント '{component}'（{ecosystem}、{dependencyType}）。最新バージョン: {latestVersion}。\n\n2〜3 文で、このライセンスが実際に発生させる義務、{dependencyType} 依存であることが露出度に与える影響、および推奨対応を 1 つ（承認 / 帰属表示の追加 / 法務レビュー / 置き換え / 隔離）示してください。認識できないライセンスの場合は条項を推測せず、不明である旨を明記してください。

security.posture=プロジェクト '{projectName}' のスキャン状況:\n- コンポーネント: {totalComponents} 個\n- CVE — Critical: {critical}、High: {high}、Medium: {medium}、Low: {low}\n- パッチ可能なライブラリ: {patchableCount}、不可: {nonPatchableCount}\n- Critical/High の CVE を持つ直接依存: {directCriticalHigh} 個\n主な問題:\n{topIssues}\n\nセキュリティ状況の要約を 2〜3 文と、最優先の対応を 1 つ。

version.diff=プロジェクト '{projectName}' '{fromVersion}' → '{toVersion}':\n- 追加 {added}、削除 {removed}、更新 {updated}、新規脅威 {newThreats}\n\n主な変更:\n{threatDetails}\n\n2〜3 文で: このリリースのセキュリティ上の影響と、緊急に必要なフォローアップ。

test.connection=OK という単語だけを返してください。

# ── Batch prompts (enrichment) ───────────────────────────────────────
batch.cve.header=プロジェクトのデプロイ状況: {deploymentProfile}。\n以下の各項目について、提供されたフィールドのみを使ってトリアージノートを作成してください。\n\nJSON 配列のみを返してください — マークダウンのコードフェンスや前後の説明は禁止:\n[{"id":"...","summary":"影響を 1 文で","recommendedAction":"具体的な対応","priority":"P0|P1|P2|P3"}]\n\nルール:\n- 入力項目ごとにオブジェクトを正確に 1 つ生成し、id をそのまま使用してください。項目の統合・並べ替え・省略・新規作成はしないでください。\n- 優先度: P0 = KEV 掲載、または信頼できない入力から容易に悪用可能。直ちに対応。P1 = 到達可能な直接依存の Critical/High。P2 = 実在するが、低い EPSS・推移的依存・このデプロイ状況での限定的な露出により緩和されている。P3 = 参考情報、実質的な影響なし。\n- summary: 深刻度の言い換えではなく、このコンポーネントで生じる具体的な結果（攻撃者が得るもの）を書いてください。\n- recommendedAction: fixVersion がある場合はそのバージョンを正確に指定し、ない場合は具体的な緩和策を書いてください。\n- 配列が途中で切れないよう、各フィールドは 200 文字以内にしてください。\n\n項目:
batch.cve.item={index}. id={id} component={component} severity={severity} cvss={cvssScore} epss={epss} kev={kevListed} title={title} osvSummary={osvSummary} fixVersion={fixVersion} cwe={cweId} vector={cvssVector} dependency={dependencyType} patchability={patchability}

batch.license.header=配布状況: {deploymentProfile}。以下のライセンス項目は必ずこの状況を前提に評価してください — 社内ツール、ネットワークサービス、配布ソフトウェアでは義務が大きく異なります。\n\nJSON 配列のみを返してください — マークダウンのコードフェンスや前後の説明は禁止:\n[{"id":"...","summary":"リスクを 1 文で","recommendedAction":"具体的な対応","priority":"P0|P1|P2|P3"}]\n\nルール:\n- 入力項目ごとにオブジェクトを正確に 1 つ生成し、id をそのまま使用してください。項目の統合・並べ替え・省略・新規作成はしないでください。\n- 優先度: P0 = この状況でリリースを妨げる義務（例: 配布ソフトウェアにおける強いコピーレフト）。P1 = リリース前に法務承認が必要。P2 = 帰属表示・告知義務への対応が必要。P3 = 寛容的、記録管理以外の対応は不要。\n- summary: ライセンス系統の説明ではなく、この状況で実際に発生する義務を書いてください。\n- recommendedAction: 承認 / 帰属表示の追加 / 法務レビュー / 置き換え / 隔離 のいずれかを理由とともに示してください。\n- 認識できないライセンスは条項を推測せず、不明である旨を明記してください。\n- 配列が途中で切れないよう、各フィールドは 200 文字以内にしてください。\n\n項目:
batch.license.item={index}. id={id} license={licenseName} status={licenseStatus} policyReason={policyReason} component={component} ecosystem={ecosystem} dependency={dependencyType} latestVersion={latestVersion}
