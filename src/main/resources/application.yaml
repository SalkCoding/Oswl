spring:
  application:
    name: oswl
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      # SBOM archives and air-gapped snapshot bundles can be several MB.
      max-file-size: ${OSWL_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${OSWL_MULTIPART_MAX_REQUEST_SIZE:50MB}

  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false
    fallback-to-system-locale: false

  jackson:
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        # Fetch LAZY associations/collections in batches instead of one-by-one (global N+1 mitigation)
        default_batch_fetch_size: 50

  flyway:
    # Opt-in DB migrations (roadmap #13). Disabled by default so existing ddl-auto deploys are unaffected.
    # Enable in production (OSWL_FLYWAY_ENABLED=true) after generating a full baseline; existing schemas
    # are baselined automatically, then versioned migrations under db/migration apply forward.
    enabled: ${OSWL_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

server:
  port: 8080
  # Default 0.0.0.0 for local/docker dev. Production overrides to 127.0.0.1 in application-prod.yaml.
  address: 0.0.0.0
  # Honor X-Forwarded-* from reverse proxies (required for HSTS behind TLS termination).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  # Gzip-compress text responses larger than 2KB
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2KB

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        # health + Prometheus scrape endpoint. /actuator/** is admin-authenticated (SecurityConfig),
        # so a scraper must present admin credentials — never exposed anonymously.
        include: health,prometheus,info
  endpoint:
    health:
      enabled: true
      show-details: never
    prometheus:
      enabled: true
    info:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

oswl:
  # Default timezone for time-sensitive features (e.g. AI usage tracking). Override with OSWL_TIMEZONE.
  timezone: ${OSWL_TIMEZONE:Asia/Seoul}
  security:
    # When true, OSWL_TD is always sent with Secure (HTTPS-only). Otherwise Secure follows request.isSecure().
    trusted-device-cookie-secure: ${OSWL_TRUSTED_DEVICE_COOKIE_SECURE:false}
    # Comma-separated list of trusted reverse-proxy IPs or CIDR ranges
    # (e.g. "10.0.0.0/8,192.168.1.10"). X-Forwarded-* headers are only honored
    # when the direct peer matches an entry here.
    # Default: empty — no proxy is trusted (safe default for direct exposure).
    # trusted-proxies: ${OSWL_SECURITY_TRUSTED_PROXIES:}
    trusted-device:
      # Optional dedicated HMAC key (Base64, 32+ bytes). Falls back to OSWL_ENCRYPTION_KEY if unset.
      hmac-key: ${OSWL_TRUSTED_DEVICE_HMAC_KEY:}
    headers:
      hsts-enabled: ${OSWL_HSTS_ENABLED:true}
      hsts-max-age-seconds: ${OSWL_HSTS_MAX_AGE:31536000}
      hsts-include-sub-domains: ${OSWL_HSTS_INCLUDE_SUBDOMAINS:true}
      hsts-preload: ${OSWL_HSTS_PRELOAD:false}
      frame-options: ${OSWL_FRAME_OPTIONS:DENY}
      # Optional: set OSWL_CONTENT_SECURITY_POLICY to override the built-in CSP draft.
  encryption:
    # REQUIRED in production. Generate with: openssl rand -base64 32
    # Set via environment variable: OSWL_ENCRYPTION_KEY
    key: ${OSWL_ENCRYPTION_KEY:}
  clone:
    # Directory for temporary git clones during Quick Import.
    # Defaults to system temp directory if left blank.
    temp-dir: ${OSWL_CLONE_TEMP_DIR:}
  quick-import:
    # When true, Quick Import may execute build tools from the cloned repository
    # (mvnw / gradlew / dotnet) for full transitive dependency resolution.
    # SECURITY: this runs arbitrary repo code on the server — enable only when
    # every imported repository is trusted. Default: false (static manifest parse only).
    allow-build-exec: ${OSWL_QUICK_IMPORT_ALLOW_BUILD_EXEC:false}
  client:
    # HTTP timeouts for the deps.dev / OSV enrichment clients. Without these, a stalled
    # upstream call previously hung indefinitely and held a deps.dev concurrency permit forever.
    deps-dev:
      connect-timeout-ms: ${OSWL_DEPSDEV_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OSWL_DEPSDEV_READ_TIMEOUT_MS:10000}
    osv:
      connect-timeout-ms: ${OSWL_OSV_CONNECT_TIMEOUT_MS:5000}
      # Generous — a 1,000-item querybatch against a slow connection legitimately takes a while.
      read-timeout-ms: ${OSWL_OSV_READ_TIMEOUT_MS:30000}
  github:
    # Override to use GitHub Enterprise Server. E.g. https://github.example.com/api/v3
    api-base: ${OSWL_GITHUB_API_BASE:https://api.github.com}
  risk-trend:
    # Maximum number of recent scans shown in the risk trend chart
    limit: ${OSWL_RISK_TREND_LIMIT:10}
  monitoring:
    # Continuous monitoring: nightly OSV re-query of every project's latest completed scan.
    # New vulnerabilities raise dashboard alerts and email project members.
    enabled: ${OSWL_MONITORING_ENABLED:true}
    # Spring cron expression (seconds minutes hours day month weekday). Default: 03:00 daily.
    cron: ${OSWL_MONITORING_CRON:0 0 3 * * *}
  airgapped:
    # Air-gapped (offline snapshot) mode. When true, vulnerability/threat-intel lookups
    # (OSV, deps.dev, FIRST.org EPSS, CISA KEV) are served from the imported offline
    # snapshot store instead of live external APIs — no outbound HTTP is attempted.
    # Import a snapshot bundle first (POST /api/admin/snapshot/import, SYSTEM_ADMIN only);
    # components absent from the snapshot resolve as "no data" (empty results).
    enabled: ${OSWL_AIRGAPPED_ENABLED:false}
  gate:
    # PR / CI security-gate default thresholds (overridable per request).
    # fail-on-severity: gate fails on CVEs at this severity or higher (CRITICAL|HIGH|MEDIUM|LOW).
    fail-on-severity: ${OSWL_GATE_FAIL_ON_SEVERITY:HIGH}
    # fail-on-kev: gate fails on any CISA KEV-listed CVE.
    fail-on-kev: ${OSWL_GATE_FAIL_ON_KEV:true}
    # fail-on-epss: gate fails on CVEs with EPSS >= this value. Set negative to disable.
    fail-on-epss: ${OSWL_GATE_FAIL_ON_EPSS:0.5}
    # fail-on-license-violation: gate fails on RESTRICTED-license components.
    fail-on-license-violation: ${OSWL_GATE_FAIL_ON_LICENSE_VIOLATION:true}
    # only-new: gate considers only findings absent from the previous completed scan (baseline).
    only-new: ${OSWL_GATE_ONLY_NEW:true}
  ai:
    embedded:
      # llama.cpp sidecar: put llama-server(.exe) and .gguf models in this directory.
      dir: ${OSWL_EMBEDDED_AI_DIR:embedded-ai}
      port: ${OSWL_EMBEDDED_AI_PORT:11435}
      context-size: ${OSWL_EMBEDDED_AI_CONTEXT:4096}
    prompts:
      # "auto" follows the server JVM/OS locale (Korean machine → Korean prompts). Set en/ko to force.
      locale: ${OSWL_AI_PROMPTS_LOCALE:auto}
      # location: file:./config/ai-prompts.properties
    enrichment:
      cve-limit: ${OSWL_AI_CVE_LIMIT:10}
      license-limit: ${OSWL_AI_LICENSE_LIMIT:8}
      daily-call-cap: ${OSWL_AI_DAILY_CALL_CAP:0}
      # Batch CVE/license items are split into chunks of this size (further halved if the
      # estimated JSON output would still exceed 80% of max_tokens) so a large cve-limit/
      # license-limit cannot produce a response that gets truncated mid-array and silently
      # drops the whole batch.
      batch-chunk-size: ${OSWL_AI_BATCH_CHUNK_SIZE:5}
    debug:
      # Periodic DEBUG logs while waiting on the LLM (0 = disabled). Local profile may override.
      heartbeat-seconds: ${OSWL_AI_DEBUG_HEARTBEAT_SECONDS:0}
      excerpt-chars: ${OSWL_AI_DEBUG_EXCERPT_CHARS:500}
      log-prompt-excerpt: ${OSWL_AI_DEBUG_LOG_PROMPT:false}
      log-response-excerpt: ${OSWL_AI_DEBUG_LOG_RESPONSE:false}
  scan-api:
    # Failed submitter password / user checks per project+email within the window
    auth-failure-max-attempts: ${OSWL_SCAN_AUTH_FAILURE_MAX:10}
    auth-failure-window-seconds: ${OSWL_SCAN_AUTH_FAILURE_WINDOW_SEC:900}
    # Total POST /api/scan attempts per project+email per minute
    request-max-per-minute: ${OSWL_SCAN_REQUEST_MAX_PER_MIN:30}
  audit:
    # Maximum number of records returned per page in the audit log API
    max-page-size: ${OSWL_AUDIT_MAX_PAGE_SIZE:200}
    # Audit log records older than this many months are automatically deleted
    retention-months: ${OSWL_AUDIT_RETENTION_MONTHS:6}

# Logs: stdout/stderr only (no logback file appender). Rotate via container/process manager if needed.

