spring:
  application:
    name: oswl
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      # SBOM archives and air-gapped snapshot bundles can be several MB.
      max-file-size: ${OSWL_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${OSWL_MULTIPART_MAX_REQUEST_SIZE:50MB}

  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false
    fallback-to-system-locale: false

  jackson:
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        # Fetch LAZY associations/collections in batches instead of one-by-one (global N+1 mitigation)
        default_batch_fetch_size: 50
        # JDBC batching of INSERT/UPDATE statements. NOTE: all entities use GenerationType.IDENTITY,
        # so Hibernate still cannot batch INSERTs (the generated id is needed immediately) — this
        # mainly batches UPDATEs. Moving PKs to sequences would unlock insert batching but is a
        # migration-risky change tracked separately as a backlog item.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    # Opt-in DB migrations. Disabled by default so existing ddl-auto deploys are unaffected.
    # Enable in production (OSWL_FLYWAY_ENABLED=true) after generating a full baseline; existing schemas
    # are baselined automatically, then versioned migrations under db/migration apply forward.
    enabled: ${OSWL_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  session:
    # Horizontal scaling / HA. "none" (default) keeps the single-instance behavior — an
    # in-memory Tomcat session, fine for a single instance. Set to "jdbc" (OSWL_SESSION_STORE_TYPE=jdbc)
    # only when running multiple instances behind a load balancer against the same PostgreSQL DB —
    # requires the spring_session/spring_session_attributes tables (db/migration/V10 or
    # db/spring_session_and_shedlock.sql) to already exist.
    store-type: ${OSWL_SESSION_STORE_TYPE:none}
    jdbc:
      # Schema is owned by Flyway/ddl-auto reference SQL (V10), never by Spring Session itself —
      # matches how this project manages every other table.
      initialize-schema: never

server:
  port: 8080
  # Default 0.0.0.0 for local/docker dev. Production overrides to 127.0.0.1 in application-prod.yaml.
  address: 0.0.0.0
  # Honor X-Forwarded-* from reverse proxies (required for HSTS behind TLS termination).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  # Gzip-compress text responses larger than 2KB
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2KB

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        # health + Prometheus scrape endpoint. /actuator/** is admin-authenticated (SecurityConfig),
        # so a scraper must present admin credentials — never exposed anonymously.
        include: health,prometheus,info
  endpoint:
    health:
      enabled: true
      show-details: never
      # Separate liveness/readiness probes. Liveness covers core infrastructure only;
      # readiness covers everything an operator needs before routing traffic to this instance.
      group:
        liveness:
          include: ping,db,diskSpace
          show-details: when-authorized
        readiness:
          include: db,diskSpace,snapshotFreshness,aiProvider,embeddedSidecar
          show-details: when-authorized
    prometheus:
      enabled: true
    info:
      enabled: true
  health:
    # Use the custom OsWL DbHealthIndicator / DiskSpaceHealthIndicator instead of the
    # auto-configured ones, so thresholds and monitored paths match the application config.
    db:
      enabled: false
    diskspace:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

oswl:
  # Default timezone for time-sensitive features (e.g. AI usage tracking). Override with OSWL_TIMEZONE.
  timezone: ${OSWL_TIMEZONE:Asia/Seoul}
  # Public URL used for deep links in outbound notifications (Slack/Teams webhooks).
  # Example: https://oswl.company.com. Leave empty to omit deep links.
  public-url: ${OSWL_PUBLIC_URL:}
  security:
    # When true, OSWL_TD is always sent with Secure (HTTPS-only). Otherwise Secure follows request.isSecure().
    trusted-device-cookie-secure: ${OSWL_TRUSTED_DEVICE_COOKIE_SECURE:false}
    # Comma-separated list of trusted reverse-proxy IPs or CIDR ranges
    # (e.g. "10.0.0.0/8,192.168.1.10"). X-Forwarded-* headers are only honored
    # when the direct peer matches an entry here.
    # Default: empty — no proxy is trusted (safe default for direct exposure).
    # trusted-proxies: ${OSWL_SECURITY_TRUSTED_PROXIES:}
    trusted-device:
      # Optional dedicated HMAC key (Base64, 32+ bytes). Falls back to OSWL_ENCRYPTION_KEY if unset.
      hmac-key: ${OSWL_TRUSTED_DEVICE_HMAC_KEY:}
    headers:
      hsts-enabled: ${OSWL_HSTS_ENABLED:true}
      hsts-max-age-seconds: ${OSWL_HSTS_MAX_AGE:31536000}
      hsts-include-sub-domains: ${OSWL_HSTS_INCLUDE_SUBDOMAINS:true}
      hsts-preload: ${OSWL_HSTS_PRELOAD:false}
      frame-options: ${OSWL_FRAME_OPTIONS:DENY}
      # Optional: set OSWL_CONTENT_SECURITY_POLICY to override the built-in CSP draft.
  encryption:
    # REQUIRED in production. Generate with: openssl rand -base64 32
    # Set via environment variable: OSWL_ENCRYPTION_KEY
    key: ${OSWL_ENCRYPTION_KEY:}
  cache:
    invalidation:
      # How often each instance polls the cache_invalidation table for version bumps made by
      # other instances. Worst-case propagation delay of a settings change in a multi-instance
      # deployment equals this interval.
      poll-interval-ms: ${OSWL_CACHE_INVALIDATION_POLL_INTERVAL_MS:5000}
    # TTL for deps.dev version metadata (isLatestVersion / deprecated / latestVersion / scorecard)
    # on cache-hit libraries. The full CVE/license TTL stays in Cache Settings (DEPS_DEV).
    version-meta-ttl-seconds: ${OSWL_VERSION_META_TTL_SEC:86400}
  clone:
    # Directory for temporary git clones during Quick Import.
    # Defaults to system temp directory if left blank.
    temp-dir: ${OSWL_CLONE_TEMP_DIR:}
    # When true, Quick Import clones are blobless (--filter=blob:none) and sparse-checked-out
    # to manifest files only (static parse path). Ignored when allow-build-exec=true, since
    # mvnw/gradlew need the full source tree. Servers without partial-clone support fall back
    # to a full shallow clone automatically.
    sparse-enabled: ${OSWL_CLONE_SPARSE_ENABLED:true}
    # Fetch source for reference analysis without authorizing repository build execution.
    include-source: ${OSWL_CLONE_INCLUDE_SOURCE:false}
  quick-import:
    # When true, Quick Import may execute build tools from the cloned repository
    # (mvnw / gradlew / dotnet) for full transitive dependency resolution.
    # SECURITY: this runs arbitrary repo code on the server — enable only when
    # every imported repository is trusted. Default: false (static manifest parse only).
    allow-build-exec: ${OSWL_QUICK_IMPORT_ALLOW_BUILD_EXEC:false}
    # Backpressure for concurrent imports. Each job runs on a virtual thread (no platform-thread
    # pool to exhaust), so these caps exist to bound DB connections, outbound HTTP and disk (clones):
    # max-concurrent limits simultaneously RUNNING imports globally — keep it below
    # spring.datasource.hikari.maximum-pool-size (default 10) or imports can starve interactive
    # requests of DB connections (a startup warning fires when this is violated).
    max-concurrent: ${OSWL_QUICK_IMPORT_MAX_CONCURRENT:3}
    # max-queued-per-user caps how many jobs one user may have queued/running at once; beyond it
    # the API rejects with 429 and a clear message. The TOTAL queue is per-user × user count —
    # there is no global queue bound, which is acceptable only because running jobs are capped above.
    max-queued-per-user: ${OSWL_QUICK_IMPORT_MAX_QUEUED_PER_USER:3}
  secretscan:
    # Regex + entropy secret scan and Terraform/Kubernetes/Dockerfile misconfiguration scan,
    # run once per Quick Import against the cloned working tree before it is deleted.
    # Findings never include the matched secret value — only file path/line/rule id/fingerprint.
    enabled: ${OSWL_SECRETSCAN_ENABLED:true}
  archive:
    # Retention policy for old scans, triggered manually via POST /api/admin/projects/{id}/archive-scans
    # (SYSTEM_ADMIN only, no scheduler). Scans beyond this count (most recent first) have their
    # scan_components/dependency_paths rows deleted; only the aggregate severity/license counts
    # remain on the scan itself. Irreversible.
    retain-scans-per-project: ${OSWL_ARCHIVE_RETAIN_SCANS:20}
  client:
    # HTTP timeouts for the deps.dev / OSV enrichment clients. Without these, a stalled
    # upstream call previously hung indefinitely and held a deps.dev concurrency permit forever.
    deps-dev:
      connect-timeout-ms: ${OSWL_DEPSDEV_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OSWL_DEPSDEV_READ_TIMEOUT_MS:10000}
      # Max simultaneous HTTP requests to deps.dev. Raised from the old fixed 10 — if the
      # upstream answers with 429 the client backs off and retries once.
      max-concurrent: ${OSWL_DEPSDEV_MAX_CONCURRENT:24}
    osv:
      connect-timeout-ms: ${OSWL_OSV_CONNECT_TIMEOUT_MS:5000}
      # Generous — a 1,000-item querybatch against a slow connection legitimately takes a while.
      read-timeout-ms: ${OSWL_OSV_READ_TIMEOUT_MS:30000}
  github:
    # Override to use GitHub Enterprise Server. E.g. https://github.example.com/api/v3
    api-base: ${OSWL_GITHUB_API_BASE:https://api.github.com}
  risk-trend:
    # Maximum number of recent scans shown in the risk trend chart
    limit: ${OSWL_RISK_TREND_LIMIT:10}
  monitoring:
    # Continuous monitoring: nightly OSV re-query of every project's latest completed scan.
    # New vulnerabilities raise dashboard alerts and email project members.
    enabled: ${OSWL_MONITORING_ENABLED:true}
    # Spring cron expression (seconds minutes hours day month weekday). Default: 03:00 daily.
    cron: ${OSWL_MONITORING_CRON:0 0 3 * * *}
  scheduler-lock:
    # Horizontal scaling / HA. Disabled by default (single-instance behavior:
    # every @Scheduled job runs locally). Enable (OSWL_SCHEDULER_LOCK_ENABLED=true)
    # only alongside a multi-instance deployment, so the nightly monitoring / defer-expiry /
    # trash-cleanup jobs run exactly once per cycle cluster-wide instead of once per instance.
    # Requires the shedlock table (db/migration/V10 or db/spring_session_and_shedlock.sql).
    enabled: ${OSWL_SCHEDULER_LOCK_ENABLED:false}
  airgapped:
    # Air-gapped (offline snapshot) mode. When true, vulnerability/threat-intel lookups
    # (OSV, deps.dev, FIRST.org EPSS, CISA KEV) are served from the imported offline
    # snapshot store instead of live external APIs — no outbound HTTP is attempted.
    # Import a snapshot bundle first (POST /api/admin/snapshot/import, SYSTEM_ADMIN only);
    # components absent from the snapshot resolve as "no data" (empty results).
    enabled: ${OSWL_AIRGAPPED_ENABLED:false}
    # Server-path import (POST /api/admin/snapshot/import-from-path) only accepts files
    # under this directory — a realpath-verified whitelist (CloneRootPathGuard), since arbitrary
    # server-path reads would otherwise be an admin-triggered file-read vulnerability. Blank
    # disables the endpoint entirely (returns 400) — an operator must opt in to a specific path.
    import-dir: ${OSWL_AIRGAPPED_IMPORT_DIR:}
    # Definition-DB staleness thresholds, measured from the oldest per-source "as of" date
    # across the imported snapshot (not builtAt/importedAt — see AirgappedSnapshotService).
    staleness-warn-days: ${OSWL_AIRGAPPED_STALENESS_WARN_DAYS:7}
    staleness-critical-days: ${OSWL_AIRGAPPED_STALENESS_CRITICAL_DAYS:30}
  gate:
    # PR / CI security-gate default thresholds (overridable per request).
    # fail-on-severity: gate fails on CVEs at this severity or higher (CRITICAL|HIGH|MEDIUM|LOW).
    fail-on-severity: ${OSWL_GATE_FAIL_ON_SEVERITY:HIGH}
    # fail-on-kev: gate fails on any CISA KEV-listed CVE.
    fail-on-kev: ${OSWL_GATE_FAIL_ON_KEV:true}
    # fail-on-epss: gate fails on CVEs with EPSS >= this value. Set negative to disable.
    fail-on-epss: ${OSWL_GATE_FAIL_ON_EPSS:0.5}
    # fail-on-license-violation: gate fails on RESTRICTED-license components.
    fail-on-license-violation: ${OSWL_GATE_FAIL_ON_LICENSE_VIOLATION:true}
    # only-new: gate considers only findings absent from the previous completed scan (baseline).
    only-new: ${OSWL_GATE_ONLY_NEW:true}
    # only-reachable: gate considers only CVEs the call-graph analysis marked REACHABLE (Java
    # only; other ecosystems have no bytecode to analyze and are always treated as reachable).
    # Default off — most projects don't have reachability data yet, and filtering on it silently
    # would hide every finding for an unanalyzed project.
    only-reachable: ${OSWL_GATE_ONLY_REACHABLE:false}
    # fail-on-secrets: gate fails when the scan found a CRITICAL/HIGH-severity secret finding.
    # Default off — turning this on for an existing project can surprise-fail its next CI run.
    fail-on-secrets: ${OSWL_GATE_FAIL_ON_SECRETS:false}
  ai:
    # Stream free-form AI calls (security posture / trend / version diff) token-by-token
    # over OpenAI-compatible SSE so the Quick Import panel can show a live preview. Endpoints
    # that reject streaming fall back to the plain non-streaming call automatically; batch
    # (JSON) calls never stream. Disable to force non-streaming behavior everywhere.
    streaming-enabled: ${OSWL_AI_STREAMING_ENABLED:true}
    anthropic:
      # Mark the (per-provider fixed) system prompt as an ephemeral cache breakpoint so
      # repeat calls within Anthropic's cache TTL are billed as cache reads. Disable if a
      # future Anthropic API/beta-header change makes this incompatible with the account.
      prompt-caching-enabled: ${OSWL_ANTHROPIC_PROMPT_CACHING_ENABLED:true}
    embedded:
      # Sidecar root: llama/ holds the runtime; model/Qwen and model/Gemma hold weights.
      dir: ${OSWL_EMBEDDED_AI_DIR:embedded-ai}
      port: ${OSWL_EMBEDDED_AI_PORT:11435}
      context-size: ${OSWL_EMBEDDED_AI_CONTEXT:8192}
      # -1 = offload as many layers as the build supports (-ngl 999); 0 = CPU only;
      # a positive number pins an explicit layer count (partial offload).
      gpu-layers: ${OSWL_EMBEDDED_AI_GPU_LAYERS:0}
      # One generation/prompt thread by default for shared burstable CPU hosts; 0 = auto.
      threads: ${OSWL_EMBEDDED_AI_THREADS:1}
      # >1 enables --parallel N --cont-batching so concurrent AI calls aren't serialized
      # on the server. context-size is the TOTAL context, divided across these slots —
      # see the slotContext warning logged at startup if it drops below 2048.
      parallel-slots: ${OSWL_EMBEDDED_AI_PARALLEL:1}
      flash-attn: ${OSWL_EMBEDDED_AI_FLASH_ATTN:true}
      # <=0 disables --cache-reuse.
      cache-reuse: ${OSWL_EMBEDDED_AI_CACHE_REUSE:256}
      # Space-separated extra llama-server CLI args, appended verbatim. SYSTEM_ADMIN-only
      # server config — never sourced from request input.
      extra-args: ${OSWL_EMBEDDED_AI_EXTRA_ARGS:}
      # GPU model loading can take longer than the previous fixed 90s wait.
      startup-timeout-seconds: ${OSWL_EMBEDDED_AI_STARTUP_TIMEOUT_SEC:120}
      # default-model-url/sha256/size-bytes are always a matched set — changing the URL without
      # updating the SHA256 to match makes every download fail checksum verification (by design:
      # this is the integrity check, not a bug to work around).
      #
      # Pinned upstream revision. A GitHub mirror may be configured only after uploading
      # and verifying a byte-identical asset; the old models-v1 asset is a different model.
      default-model-url: ${OSWL_EMBEDDED_DEFAULT_MODEL_URL:https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf}
      default-model-sha256: ${OSWL_EMBEDDED_DEFAULT_MODEL_SHA256:aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223}
      default-model-size-bytes: ${OSWL_EMBEDDED_DEFAULT_MODEL_SIZE_BYTES:1280835840}
      # Optional byte-identical mirror; no unverified release URL is assumed to exist.
      fallback-model-url: ${OSWL_EMBEDDED_FALLBACK_MODEL_URL:}
      # Prefetches the default model in the background on boot (if none is present yet) so
      # a user who later visits Settings and clicks Start does not hit a surprise 1.2GB download.
      # Download-only — never starts the sidecar or changes the active AI provider on its own.
      # Never attempted in air-gapped mode regardless of this setting (oswl.airgapped.enabled).
      auto-download-on-boot: ${OSWL_EMBEDDED_AUTO_DOWNLOAD:true}
    prompts:
      # "auto" follows the server JVM/OS locale (Korean machine → Korean prompts). Set en/ko to force.
      locale: ${OSWL_AI_PROMPTS_LOCALE:auto}
      # location: file:./config/ai-prompts.properties
    enrichment:
      cve-limit: ${OSWL_AI_CVE_LIMIT:10}
      license-limit: ${OSWL_AI_LICENSE_LIMIT:8}
      daily-call-cap: ${OSWL_AI_DAILY_CALL_CAP:0}
      # Batch CVE/license items are split into chunks of this size (further halved if the
      # estimated JSON output would still exceed 80% of max_tokens) so a large cve-limit/
      # license-limit cannot produce a response that gets truncated mid-array and silently
      # drops the whole batch.
      batch-chunk-size: ${OSWL_AI_BATCH_CHUNK_SIZE:5}
      # AiProvider.LOCAL batch calls use the leaner "*.header.local" prompt variant (3 output
      # fields + a worked example instead of 4 fields + a 4-line priority rubric) — a small
      # self-hosted model follows a simple schema far more reliably than the full one meant
      # for larger cloud models.
      local-simple-schema: ${OSWL_AI_LOCAL_SIMPLE_SCHEMA:true}
      # Batch calls that come back empty (not a transport error/429 — those are the AI client's
      # own concern) are retried by splitting the chunk in half and recursing, bounded by this
      # many split levels, rather than resubmitting the identical prompt unchanged.
      max-retries: ${OSWL_AI_MAX_RETRIES:1}
      # The 5 independent AI enrichment blocks (CVE/license batch, posture, trend, version diff)
      # run concurrently — this caps how many run at once, mainly to stay under cloud
      # provider rate limits. A local llama-server benefits from --parallel (see embedded.*) up
      # to this same count.
      max-parallel-calls: ${OSWL_AI_MAX_PARALLEL_CALLS:3}
    debug:
      # Periodic DEBUG logs while waiting on the LLM (0 = disabled). Local profile may override.
      heartbeat-seconds: ${OSWL_AI_DEBUG_HEARTBEAT_SECONDS:0}
      excerpt-chars: ${OSWL_AI_DEBUG_EXCERPT_CHARS:500}
      log-prompt-excerpt: ${OSWL_AI_DEBUG_LOG_PROMPT:false}
      log-response-excerpt: ${OSWL_AI_DEBUG_LOG_RESPONSE:false}
  scan-api:
    # Failed submitter password / user checks per project+email within the window
    auth-failure-max-attempts: ${OSWL_SCAN_AUTH_FAILURE_MAX:10}
    auth-failure-window-seconds: ${OSWL_SCAN_AUTH_FAILURE_WINDOW_SEC:900}
    # Total POST /api/scan attempts per project+email per minute
    request-max-per-minute: ${OSWL_SCAN_REQUEST_MAX_PER_MIN:30}
  audit:
    # Maximum number of records returned per page in the audit log API
    max-page-size: ${OSWL_AUDIT_MAX_PAGE_SIZE:200}
    # Audit log records older than this many months are automatically deleted
    retention-months: ${OSWL_AUDIT_RETENTION_MONTHS:6}
    integrity:
      # When true, the application verifies the audit log hash chain on startup and exits.
      verify-and-exit: ${OSWL_AUDIT_INTEGRITY_VERIFY_AND_EXIT:false}
      # Batch size used by the verification API/CLI
      batch-size: ${OSWL_AUDIT_INTEGRITY_BATCH_SIZE:1000}

# Logging: see logback-spring.xml. local/test are console-only. prod additionally writes a
# rotating file under OSWL_LOG_DIR (default ./logs) — OSWL_LOG_JSON=true switches it to
# structured JSON for SIEM ingestion.

