# Production profile — see docs/en/Production-Deployment-Checklist.md
# Required env: DB_URL, DB_USERNAME, DB_PASSWORD, OSWL_ENCRYPTION_KEY
# Bind: SERVER_ADDRESS (default 127.0.0.1). Expose via reverse proxy only unless you accept 0.0.0.0 risk.

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

# ── OIDC SSO — uncomment and fill in to enable Okta / Entra / any OIDC provider ──
# When configured, a "Sign in with SSO" option appears on /login; the verified email is mapped to
# an existing OsWL user (provisioning-gated). Leaving this out keeps email + OTP as the only login.
# spring:
#   security:
#     oauth2:
#       client:
#         registration:
#           oidc:
#             client-id: ${OSWL_OIDC_CLIENT_ID}
#             client-secret: ${OSWL_OIDC_CLIENT_SECRET}
#             scope: openid,email,profile
#             client-name: SSO
#         provider:
#           oidc:
#             issuer-uri: ${OSWL_OIDC_ISSUER_URI}   # e.g. https://your-tenant.okta.com or https://login.microsoftonline.com/<tenant>/v2.0

# ── SAML 2.0 SSO — uncomment and fill in to enable Okta / Entra ID / AD FS ──
# When configured, a "Sign in with SSO" option appears on /login; the verified email is mapped
# to an existing OsWL user, or a disabled account is auto-provisioned for SCIM activation.
# SP metadata is exposed at /saml2/service-provider-metadata/{registrationId}.
# spring:
#   security:
#     saml2:
#       relyingparty:
#         registration:
#           oswl:
#             signing.credentials:
#               - private-key-location: ${OSWL_SAML_SP_PRIVATE_KEY}
#                 certificate-location: ${OSWL_SAML_SP_CERTIFICATE}
#             identityprovider:
#               metadata-uri: ${OSWL_SAML_IDP_METADATA_URL}   # e.g. https://your-tenant.okta.com/app/your-app/sso/saml/metadata
#               verification.credentials:
#                 - certificate-location: ${OSWL_SAML_IDP_CERTIFICATE}

# ── SCIM 2.0 provisioning ──
# Groups pushed by the IdP map to either Team (default) or RoleTemplate.
# oswl:
#   scim:
#     group-mapping: TEAM   # TEAM | ROLE_TEMPLATE

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        # /actuator/** is admin-authenticated (SecurityConfig) — scrapers must present admin credentials.
        include: health,prometheus,info
  endpoint:
    health:
      enabled: true
      show-details: never
      # Separate liveness/readiness probes. Liveness covers core infrastructure only;
      # readiness covers everything an operator needs before routing traffic to this instance.
      group:
        liveness:
          include: ping,db,diskSpace
          show-details: when-authorized
        readiness:
          include: db,diskSpace,snapshotFreshness,aiProvider,embeddedSidecar
          show-details: when-authorized
    prometheus:
      enabled: true
    info:
      enabled: true
  health:
    # Use the custom OsWL DbHealthIndicator / DiskSpaceHealthIndicator instead of the
    # auto-configured ones, so thresholds and monitored paths match the application config.
    db:
      enabled: false
    diskspace:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

oswl:
  security:
    trusted-device-cookie-secure: true
    headers:
      hsts-enabled: true
      frame-options: DENY
  encryption:
    key: ${OSWL_ENCRYPTION_KEY:}
  ai:
    debug:
      heartbeat-seconds: 0
      log-prompt-excerpt: false
      log-response-excerpt: false

spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  thymeleaf:
    cache: true

# Production: concise operational logs only (INFO/WARN/ERROR).
logging:
  level:
    root: INFO
    com.salkcoding.oswl: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
