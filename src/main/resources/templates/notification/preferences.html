<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{webPush.title})}"></head>
<body class="settings-page notification-page bg-[var(--grayscale-5)]">
<header th:replace="~{fragments/topbar :: simple-topbar(#{webPush.title})}"></header>
<main class="w-full max-w-[760px] mx-auto my-8 px-6 py-8 flex flex-col gap-5 bg-white border border-[var(--grayscale-20)] rounded-[12px]" x-data="webPushPreferences()">
    <a th:href="@{/projects}" class="underline" th:text="#{webPush.back}">Projects</a>
    <h1 class="font-bold text-2xl" th:text="#{webPush.title}">Browser security alerts</h1>
    <p th:text="#{webPush.help}"></p>
    <p role="alert" x-show="error" x-text="error" class="text-red-700"></p>
    <button type="button" x-show="error && !busy" @click="load()" th:text="#{common.retry}" class="self-start underline p-2">Retry</button>
    <p x-show="loaded && !configured" th:text="#{webPush.unconfigured}"></p>
    <p x-show="!supported" th:text="#{webPush.unsupported}"></p>
    <p role="status" x-show="active" x-cloak th:text="#{webPush.active}"></p>
    <fieldset :disabled="!loaded || !configured || !supported || busy" class="flex flex-col gap-4">
        <legend class="font-bold mb-3" th:text="#{webPush.events}"></legend>
        <label class="flex items-center gap-3 py-2"><input type="checkbox" x-model="newHighRisk" /><span th:text="#{webPush.high}"></span></label>
        <label class="flex items-center gap-3 py-2"><input type="checkbox" x-model="gateFailure" /><span th:text="#{webPush.gate}"></span></label>
        <button type="button" @click="enable()" class="bg-[var(--primary-120)] text-white rounded px-4 py-3" th:text="#{webPush.enable}">Enable / save preferences</button>
    </fieldset>
    <button type="button" @click="disable()" :disabled="busy || !loaded || !supported" class="border rounded px-4 py-3 disabled:opacity-40" th:text="#{webPush.disable}">Unsubscribe this browser</button>
</main>
<footer th:replace="~{fragments/footer :: site-footer}"></footer>
<script th:inline="javascript">const _pushI18n = {failed: /*[[#{webPush.failed}]]*/ 'Request failed. Retry.', denied: /*[[#{webPush.denied}]]*/ 'Allow notifications in browser settings.'};</script>
<script th:src="@{/js/web-push-preferences.min.js}"></script>
</body>
</html>
