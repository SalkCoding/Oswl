<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

    <!--
        Settings sub-tab nav button. Renders one button for a single (key, label) pair; the host
        page wraps calls to this fragment in its own flex row.

        The host page must define, in its own Alpine component:
          - a `subTab` string ('' | key1 | key2 | ...)
          - a `selectSubTab(key)` method that sets `subTab`, syncs the URL via
            `syncSettingsSection(key)` (static/js/settings-subtabs.js), and lazy-loads that
            section's data if it hasn't been loaded yet.

        usage: th:replace="~{fragments/settings-subtabs :: subtabButton('audit', #{settings.admin.auditLog.heading})}"
    -->
    <button type="button" th:fragment="subtabButton(key, label)"
            th:attr="data-section=${key}"
            role="tab"
            @click="selectSubTab($el.dataset.section)"
            :aria-selected="subTab === $el.dataset.section"
            :tabindex="subTab === $el.dataset.section ? 0 : -1"
            @keydown.arrow-right.prevent="(() => { const tabs = [...$el.parentElement.querySelectorAll('[data-section]')]; tabs[(tabs.indexOf($el) + 1) % tabs.length].focus(); })()"
            @keydown.arrow-left.prevent="(() => { const tabs = [...$el.parentElement.querySelectorAll('[data-section]')]; tabs[(tabs.indexOf($el) - 1 + tabs.length) % tabs.length].focus(); })()"
            :class="subTab === $el.dataset.section ? 'border-[var(--brand-primary)] text-[var(--grayscale-100)] font-bold' : 'border-transparent text-[var(--grayscale-60)] font-normal'"
            class="px-[8px] py-[12px] text-[14px] border-b-[2px] transition-colors"
            th:text="${label}">Tab</button>

</body>
</html>
