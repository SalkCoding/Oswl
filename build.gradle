tasks.register('syncThirdPartyLicenseVersions') {
	description = 'Rewrites only the **Version:** lines in THIRD_PARTY_LICENSES.md from the OSS ' +
			'manifest — no other prose (license text, distribution policy) is touched.'
	group = 'documentation'
	dependsOn 'generateOssManifest'
	doLast {
		def manifestFile = layout.buildDirectory.file('generated/oss-manifest/oss-versions.json').get().asFile
		def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
		def licenseFile = file('THIRD_PARTY_LICENSES.md')
		def sectionHeaderPattern = ~/^###\s+(.+?)\s*$/
		def versionLinePattern = ~/^(-\s*\*\*Version:\*\*\s*)(.+)$/

		def currentSection = null
		def changed = 0
		def output = licenseFile.readLines('UTF-8').collect { line ->
			def headerMatch = sectionHeaderPattern.matcher(line)
			if (headerMatch.matches()) {
				currentSection = headerMatch.group(1)
				return line
			}
			def versionMatch = versionLinePattern.matcher(line)
			if (!versionMatch.matches() || currentSection == null) {
				return line
			}
			def spec = thirdPartyVersionSections[currentSection]
			if (spec == null) {
				return line // untracked section (e.g. Qwen3-1.7B) — never touched
			}
			def value = manifest[spec.key]
			if (value == null || value == 'UNRESOLVED') {
				logger.warn("[syncThirdPartyLicenseVersions] No resolved value for '${currentSection}' " +
						"(manifest key '${spec.key}') — leaving its Version line unchanged")
				return line
			}
			def prefix = versionMatch.group(1)
			def rest = versionMatch.group(2)
			def newRest
			if (spec.mode == 'literal') {
				// Preserve any trailing parenthetical note, e.g. "3.4.19 (Standalone CLI binary...)"
				def noteMatch = (rest =~ /^(\S+)(\s*\(.*\))?$/)
				def note = noteMatch.matches() ? (noteMatch.group(2) ?: '') : ''
				newRest = "${value}${note}"
			} else {
				// "Managed by <project> X.Y.Z[...]" — replace only the first version-shaped token.
				newRest = rest.replaceFirst(/[0-9][0-9A-Za-z.\-]*/, value)
			}
			if (newRest != rest) {
				changed++
				return "${prefix}${newRest}"
			}
			return line
		}
		if (changed > 0) {
			licenseFile.text = output.join('\n') + '\n'
			logger.lifecycle("[syncThirdPartyLicenseVersions] Updated ${changed} Version line(s) in THIRD_PARTY_LICENSES.md")
		} else {
			logger.lifecycle('[syncThirdPartyLicenseVersions] THIRD_PARTY_LICENSES.md versions already up to date')
		}
	}
}

tasks.register('vdbBuild', JavaExec) {
	description = 'Runs the oswl-vdb CLI (build/verify/inspect offline vulnerability-DB bundles) — ' +
			'see scripts/oswl-vdb/oswl-vdb.{sh,ps1} for thin wrapper scripts. ' +
			'Example: ./gradlew vdbBuild --args="build --wanted wanted-list.jsonl --out bundle.zip"'
	group = 'application'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.salkcoding.oswl.vdb.VdbBuilderCli'
	// JavaExec's `args` property is natively --args-able from the Gradle CLI; with none given,
	// VdbBuilderCli prints its own usage.
}

tasks.register('generateSchemaBaseline', JavaExec) {
	description = 'Regenerates PostgreSQL DDL from the JPA entities (source material for a Flyway ' +
			'baseline migration). Writes build/schema-baseline.sql; review before folding into db/migration.'
	group = 'build'
	classpath = sourceSets.main.runtimeClasspath + sourceSets.local.runtimeClasspath
	mainClass = 'com.salkcoding.oswl.local.SchemaBaselineGenerator'
}
