import java.util.zip.ZipInputStream

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.salkcoding'
// x-release-please-start-version
version = '1.0.4'
// x-release-please-end

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Local-only sources (TestDataController, etc.) — included in bootRun and tests, excluded from bootJar.
sourceSets {
	local {
		java {
			srcDir 'src/local/java'
		}
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.local.output
		runtimeClasspath += sourceSets.local.output
	}
	// Playwright-driven UI/accessibility tests against a live app instance.
	// Deliberately separate from `test`: needs a browser download (hundreds of MB) and a real
	// Spring Boot boot, so it must never run as part of the default `./gradlew test`/`check`.
	uiTest {
		java {
			srcDir 'src/uiTest/java'
		}
		// resources default to src/uiTest/resources by convention — no extra srcDir needed.
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.local.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.local.output
	}
}

configurations {
	uiTestImplementation.extendsFrom testImplementation
	uiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
	mavenCentral()
	// Spring Security SAML 7+ pulls OpenSAML 5.x from the Shibboleth repository.
	maven { url 'https://build.shibboleth.net/maven/releases/' }
}

dependencies {
	// Bytecode call-graph analysis (ROADMAP A2)
	implementation 'org.ow2.asm:asm:9.7'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// In-memory query cache for read-heavy configuration data
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// Local dev: embedded SMTP server for testing mail delivery without a real relay
	implementation 'com.icegreen:greenmail:2.1.11'

	// CycloneDX SBOM export/import (spec 1.6)
	implementation 'org.cyclonedx:cyclonedx-core-java:13.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus scrape endpoint (/actuator/prometheus)
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// OIDC SSO (Okta / Entra) — optional, activated only when a provider is configured
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// SAML 2.0 SSO (Okta / Entra ID / AD FS) — optional, activated only when IdP metadata is configured
	implementation 'org.springframework.security:spring-security-saml2-service-provider'
	// Flyway DB migrations (prod-profile gated)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Horizontal scaling / HA: cluster-wide HTTP sessions so a multi-instance
	// deployment behind a load balancer doesn't drop auth on failover.
	implementation 'org.springframework.session:spring-session-jdbc'
	// Cluster-wide dedup for @Scheduled jobs — without this, 2 instances would
	// each run the nightly monitoring/defer-expiry/trash-cleanup jobs independently.
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.7.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.7.0'

    compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// Local-only controllers (TestDataController) — on IDE/bootRun classpath, excluded from bootJar.
	developmentOnly sourceSets.local.output
	implementation 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Headless-browser UI/accessibility verification (ROADMAP v1.0.5.1 — V1). Java-native: no
	// package.json/npm needed, same "standalone binary, self-managed" spirit as the Tailwind CLI
	// and esbuild downloads below — Playwright's own CLI fetches its browser binaries on demand.
	uiTestImplementation 'com.microsoft.playwright:playwright:1.52.0'
	uiTestImplementation 'com.deque.html.axe-core:playwright:4.10.1'
	uiTestCompileOnly 'org.projectlombok:lombok'
	uiTestAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('compileLocalJava') {
	dependsOn compileJava
	options.annotationProcessorPath = configurations.annotationProcessor
}

// Ensure local sources compile on every dev build (IDE "Run" as well as Gradle).
tasks.named('compileJava') {
	finalizedBy compileLocalJava
}

tasks.named('bootRun') {
	dependsOn compileLocalJava
	doFirst {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def script = os.isWindows() ? file('scripts/check-java.ps1') : file('scripts/check-java.sh')
		if (script.exists()) {
			def cmd = os.isWindows()
					? ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script.absolutePath]
					: ['bash', script.absolutePath]
			try {
				// Gradle 9 removed Project.exec(), which silently turned this preflight into a
				// warning on every bootRun. ProcessBuilder keeps it working without needing the
				// injected ExecOperations service plumbing.
				def exitValue = new ProcessBuilder(cmd)
						.directory(projectDir)
						.inheritIO()
						.start()
						.waitFor()
				if (exitValue != 0) {
					throw new GradleException('JDK preflight failed — see the install instructions above.')
				}
			} catch (GradleException e) {
				throw e
			} catch (Exception e) {
				// Preflight runner itself unavailable (no bash/powershell) — don't block startup
				logger.warn("[OsWL] JDK preflight could not run (${e.message}) — continuing.")
			}
		}
	}
	jvmArgs = ['-Djava.net.preferIPv4Stack=true']
	classpath = sourceSets.main.runtimeClasspath + sourceSets.local.runtimeClasspath
}

tasks.named('bootJar') {
	// Production JAR: main sources only (no src/local/java).
}

tasks.register('verifyProdJar') {
	group = 'verification'
	description = 'Fails if local-only classes (e.g. TestDataController) are packaged in bootJar.'
	dependsOn bootJar, compileLocalJava
	doLast {
		def jarFile = providers.gradleProperty('verifyJar').isPresent()
				? file(providers.gradleProperty('verifyJar').get())
				: tasks.named('bootJar').get().archiveFile.get().asFile
		def forbidden = new HashSet<String>()
		sourceSets.local.output.classesDirs.files.each { root ->
			fileTree(root).matching { include '**/*.class' }.files.each { compiled ->
				forbidden.add(root.toPath().relativize(compiled.toPath()).toString().replace('\\', '/'))
			}
		}
		if (forbidden.isEmpty()) throw new GradleException('No compiled local classes to verify.')
		jarFile.withInputStream { input ->
			def zip = new ZipInputStream(input)
			def entry
			while ((entry = zip.nextEntry) != null) {
				def classPath = entry.name.replaceFirst('^BOOT-INF/classes/', '')
				if (forbidden.contains(classPath)) {
					throw new GradleException("Production JAR must not contain ${entry.name}. Use src/local/java and bootRun classpath only.")
				}
			}
		}
		logger.lifecycle("verifyProdJar: OK — no local-only controllers in ${jarFile.name}")
	}
}

tasks.named('compileTestJava') {
	dependsOn compileLocalJava
}

tasks.named('test') {
	dependsOn compileLocalJava
}

tasks.named('compileUiTestJava') {
	dependsOn compileLocalJava
}

// ─────────────────────────────────────────────────────────────────────────────
// Playwright + axe-core UI verification
//
// `./gradlew uiTest` boots the real app (@SpringBootTest RANDOM_PORT) and drives it with a
// headless Chromium via Playwright. Kept out of `test`/`check` on purpose — see sourceSets.uiTest
// above. In an offline/air-gapped build environment, pre-populate the browser cache and point
// PLAYWRIGHT_BROWSERS_PATH at it instead of relying on installPlaywrightBrowsers' download.
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('installPlaywrightBrowsers', JavaExec) {
	description = 'Downloads the Playwright Chromium browser binary into the local Playwright cache (cached; run once or after a Playwright version bump).'
	group = 'verification'
	classpath = configurations.uiTestRuntimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args = ['install', 'chromium']
}

tasks.register('uiTest', Test) {
	description = 'Runs Playwright-driven UI and axe-core accessibility tests against a live app instance. Not part of test/check — run explicitly.'
	group = 'verification'
	dependsOn 'installPlaywrightBrowsers'
	testClassesDirs = sourceSets.uiTest.output.classesDirs
	classpath = sourceSets.uiTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
	// Isolated URL rewrites let pipeline fixtures use their loopback Git server.
	environment 'GIT_CONFIG_GLOBAL', layout.buildDirectory.file('uitest/git-config').get().asFile.absolutePath
}

jacoco {
	toolVersion = '0.8.15'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	// 커버리지에서 제외할 항목: 설정 클래스, DTO, 엔티티, AOP, 생성된 코드 등
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/OswlApplication*',
				'**/config/**',
				'**/dto/**',
				'**/entity/**',
				'**/enums/**',
				'**/exception/**',
				'**/web/config/**',
				'**/web/interceptor/**',
				'**/aop/**',
				'**/scheduler/**',
				'**/logging/**',
				'**/domain/**',
				'**/spec/**',
			])
		}))
	}
}

// ─────────────────────────────────────────────────────────────────────────────
// Tailwind CSS production build
//
// Replaces the cdn.tailwindcss.com runtime in templates/fragments/head.html
// with a precompiled, minified stylesheet served from /css/tailwind.css.
//
// Uses the Tailwind Standalone CLI (no Node.js required). Binary is downloaded
// to build/tools/ on first build, cached thereafter.
// ─────────────────────────────────────────────────────────────────────────────
ext {
	tailwindVersion = '3.4.19'
	tailwindToolDir = layout.buildDirectory.dir("tools/tailwindcss-${tailwindVersion}").get().asFile
}

static def tailwindBinaryName() {
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def aarch = (arch == 'aarch64' || arch == 'arm64')
	if (os.contains('win')) {
		return aarch ? 'tailwindcss-windows-arm64.exe' : 'tailwindcss-windows-x64.exe'
	} else if (os.contains('mac')) {
		return aarch ? 'tailwindcss-macos-arm64' : 'tailwindcss-macos-x64'
	} else {
		return aarch ? 'tailwindcss-linux-arm64' : 'tailwindcss-linux-x64'
	}
}

tasks.register('downloadTailwindCli') {
	description = 'Downloads the Tailwind CSS standalone CLI binary (cached).'
	group = 'frontend'
	def binName = tailwindBinaryName()
	def target = new File(tailwindToolDir, binName)
	outputs.file(target)
	doLast {
		if (!target.exists()) {
			tailwindToolDir.mkdirs()
			def url = "https://github.com/tailwindlabs/tailwindcss/releases/download/v${tailwindVersion}/${binName}"
			logger.lifecycle("[tailwind] downloading ${url}")
			URI.create(url).toURL().withInputStream { i -> target.withOutputStream { o -> o << i } }
			if (!System.getProperty('os.name').toLowerCase().contains('win')) {
				target.setExecutable(true, false)
			}
			logger.lifecycle("[tailwind] saved to ${target}")
		}
	}
}

tasks.register('buildTailwindCss', Exec) {
	description = 'Compiles Tailwind CSS to src/main/resources/static/css/tailwind.css.'
	group = 'frontend'
	dependsOn 'downloadTailwindCli', 'downloadVendorJs'

	def binFile  = new File(tailwindToolDir, tailwindBinaryName())
	def inputCss = file('tailwind/input.css')
	def configJs = file('tailwind/tailwind.config.js')
	def outCss   = file('src/main/resources/static/css/tailwind.css')

	inputs.file(inputCss)
	inputs.file(configJs)
	inputs.dir('src/main/resources/templates')
	// Sources only — the generated .min.js files (minifyJs) mirror them and would
	// otherwise overlap with this task's input directory.
	inputs.files(fileTree('src/main/resources/static/js') { exclude '**/*.min.js' })
	outputs.file(outCss)

	doFirst {
		outCss.parentFile.mkdirs()
	}

	commandLine binFile.absolutePath,
		'-c', configJs.absolutePath,
		'-i', inputCss.absolutePath,
		'-o', outCss.absolutePath,
		'--minify'
}

processResources.dependsOn 'buildTailwindCss'

// ─────────────────────────────────────────────────────────────────────────────
// Frontend vendor JS (Alpine.js, collapse plugin, HTMX) — served from /js/vendor/
// ─────────────────────────────────────────────────────────────────────────────
ext {
	alpineVersion = '3.15.12'
	htmxVersion = '2.0.10'
	chartJsVersion = '4.5.1'
}

tasks.register('downloadVendorJs') {
	description = 'Downloads Alpine.js, @alpinejs/collapse, and HTMX into static/js/vendor/.'
	group = 'frontend'
	def vendorDir = file('src/main/resources/static/js/vendor')
	def files = [
		[name: 'alpine-collapse.min.js', url: "https://cdn.jsdelivr.net/npm/@alpinejs/collapse@${alpineVersion}/dist/cdn.min.js"],
		[name: 'alpine.min.js',          url: "https://cdn.jsdelivr.net/npm/alpinejs@${alpineVersion}/dist/cdn.min.js"],
		[name: 'htmx.min.js',            url: "https://unpkg.com/htmx.org@${htmxVersion}/dist/htmx.min.js"],
		[name: 'chart.umd.min.js',       url: "https://cdn.jsdelivr.net/npm/chart.js@${chartJsVersion}/dist/chart.umd.min.js"],
	]
	// Pinned versions are part of the task inputs so a version bump actually re-downloads
	// instead of silently keeping the previously cached file on disk.
	def stamp = "alpine=${alpineVersion};htmx=${htmxVersion};chartjs=${chartJsVersion}"
	inputs.property('vendorVersions', stamp)
	outputs.dir(vendorDir)
	doLast {
		vendorDir.mkdirs()
		def stampFile = new File(vendorDir, '.versions')
		def stale = !stampFile.exists() || stampFile.text != stamp
		files.each { f ->
			def target = new File(vendorDir, f.name)
			if (stale || !target.exists()) {
				logger.lifecycle("[vendor-js] downloading ${f.url}")
				URI.create(f.url).toURL().withInputStream { i -> target.withOutputStream { o -> o << i } }
			}
		}
		stampFile.text = stamp
	}
}

processResources.dependsOn 'downloadVendorJs'

// ─────────────────────────────────────────────────────────────────────────────
// Custom JS minification
//
// Minifies src/main/resources/static/js/**/*.js (vendor/ excluded — vendor files
// already ship minified from their CDNs) to <name>.min.js next to each source.
// Templates reference the .min.js files; the unminified sources stay the editable
// originals. The generated .min.js files are gitignored (build output, same as
// tailwind.css).
//
// Uses the esbuild standalone binary (no Node.js required), downloaded from the
// npm registry to build/tools/ on first build — same pattern as the Tailwind CLI.
// ─────────────────────────────────────────────────────────────────────────────
ext {
	esbuildVersion = '0.28.1'
	esbuildToolDir = layout.buildDirectory.dir("tools/esbuild-${esbuildVersion}").get().asFile
}

static def esbuildPackageName() {
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def aarch = (arch == 'aarch64' || arch == 'arm64')
	if (os.contains('win')) {
		return aarch ? 'win32-arm64' : 'win32-x64'
	} else if (os.contains('mac')) {
		return aarch ? 'darwin-arm64' : 'darwin-x64'
	} else {
		return aarch ? 'linux-arm64' : 'linux-x64'
	}
}

static def esbuildBinaryFile(File toolDir) {
	// The npm tgz extracts under package/; the binary is package/esbuild.exe on
	// Windows and package/bin/esbuild elsewhere.
	return System.getProperty('os.name').toLowerCase().contains('win')
		? new File(toolDir, 'unpacked/package/esbuild.exe')
		: new File(toolDir, 'unpacked/package/bin/esbuild')
}

tasks.register('downloadEsbuild') {
	description = 'Downloads the esbuild standalone binary from the npm registry (cached).'
	group = 'frontend'
	def pkg = esbuildPackageName()
	def tgz = new File(esbuildToolDir, "${pkg}.tgz")
	def marker = esbuildBinaryFile(esbuildToolDir)
	outputs.file(marker)
	doLast {
		if (!marker.exists()) {
			esbuildToolDir.mkdirs()
			def url = "https://registry.npmjs.org/@esbuild/${pkg}/-/${pkg}-${esbuildVersion}.tgz"
			logger.lifecycle("[esbuild] downloading ${url}")
			URI.create(url).toURL().withInputStream { i -> tgz.withOutputStream { o -> o << i } }
			def unpacked = new File(esbuildToolDir, 'unpacked')
			unpacked.mkdirs()
			project.copy {
				from(tarTree(resources.gzip(tgz)))
				into(unpacked)
			}
			if (!System.getProperty('os.name').toLowerCase().contains('win')) {
				marker.setExecutable(true, false)
			}
			logger.lifecycle("[esbuild] extracted to ${marker}")
		}
	}
}

tasks.register('minifyJs') {
	description = 'Minifies custom static JS (vendor excluded) to <name>.min.js next to each source.'
	group = 'frontend'
	dependsOn 'downloadEsbuild'

	def jsDir = file('src/main/resources/static/js')
	def sources = fileTree(jsDir) {
		include '**/*.js'
		exclude 'vendor/**'
		exclude '**/*.min.js'
	}
	def minified = sources.files.collect { f -> new File(f.parent, f.name.replaceAll(/\.js$/, '.min.js')) }

	inputs.files(sources)
	outputs.files(minified)

	doLast {
		def bin = esbuildBinaryFile(esbuildToolDir)
		sources.files.each { src ->
			def out = new File(src.parent, src.name.replaceAll(/\.js$/, '.min.js'))
			// ProcessBuilder rather than an Exec task so one task handles all files;
			// project.exec was removed in Gradle 9.
			def proc = new ProcessBuilder(bin.absolutePath, src.absolutePath, '--minify',
				"--outfile=${out.absolutePath}".toString())
				.redirectErrorStream(true).start()
			def output = proc.inputStream.text
			if (proc.waitFor() != 0) {
				throw new GradleException("esbuild failed for ${src}: ${output}")
			}
		}
	}
}

processResources.dependsOn 'minifyJs'

// ─────────────────────────────────────────────────────────────────────────────
// OSS notices / THIRD_PARTY_LICENSES.md version single-sourcing.
// This is version-SYNC automation, not dependency-DISCOVERY — a newly added
// library must be added to both maps below, or it is simply not tracked.
// ─────────────────────────────────────────────────────────────────────────────

// slug -> "group:artifact" for every backend library tracked in THIRD_PARTY_LICENSES.md /
// oss-notices.html. Frontend vendor JS (Alpine/htmx/Chart.js/Tailwind) isn't a Gradle
// dependency — generateOssManifest reads those straight from the existing ext versions above.
ext.trackedOssCoordinates = [
	springBoot             : 'org.springframework.boot:spring-boot',
	springSecurity         : 'org.springframework.security:spring-security-core',
	springDataJpa          : 'org.springframework.data:spring-data-jpa',
	hibernate              : 'org.hibernate.orm:hibernate-core',
	thymeleaf              : 'org.thymeleaf:thymeleaf',
	thymeleafSpringSecurity: 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6',
	springdocOpenapi       : 'org.springdoc:springdoc-openapi-starter-webmvc-ui',
	jackson                : 'com.fasterxml.jackson.core:jackson-databind',
	logback                : 'ch.qos.logback:logback-classic',
	slf4j                  : 'org.slf4j:slf4j-api',
	greenmail              : 'com.icegreen:greenmail',
	h2                     : 'com.h2database:h2',
	postgresqlJdbc         : 'org.postgresql:postgresql',
	lombok                 : 'org.projectlombok:lombok',
	caffeine               : 'com.github.ben-manes.caffeine:caffeine',
	cyclonedx              : 'org.cyclonedx:cyclonedx-core-java',
	packageurl             : 'com.github.package-url:packageurl-java',
	micrometer             : 'io.micrometer:micrometer-registry-prometheus',
	flyway                 : 'org.flywaydb:flyway-core',
	springOauth2           : 'org.springframework.security:spring-security-oauth2-client',
	springSaml2Provider    : 'org.springframework.security:spring-security-saml2-service-provider',
	springSessionJdbc      : 'org.springframework.session:spring-session-jdbc',
	shedlock               : 'net.javacrumbs.shedlock:shedlock-spring',
]

tasks.register('generateOssManifest') {
	description = 'Resolves runtime dependency versions and writes the single OSS version manifest ' +
			'consumed by the /oss-notices page and the THIRD_PARTY_LICENSES.md sync task.'
	group = 'documentation'
	def outputFile = layout.buildDirectory.file('generated/oss-manifest/oss-versions.json')
	outputs.file(outputFile)
	doLast {
		// compileClasspath also resolves compileOnly-only deps (e.g. lombok) that
		// runtimeClasspath doesn't carry; runtimeClasspath wins where both resolve a coordinate,
		// since that's the version actually shipped. Uses the resolution-result API (not the
		// older resolvedConfiguration/LenientConfiguration, whose allModuleVersions accessor is
		// gone on this project's Gradle version) so unresolved/optional dependencies are skipped
		// rather than failing the whole task.
		def fromConfig = { cfg ->
			cfg.incoming.resolutionResult.allComponents.findAll { it.moduleVersion != null }.collectEntries {
				["${it.moduleVersion.group}:${it.moduleVersion.name}".toString(), it.moduleVersion.version]
			}
		}
		def resolved = fromConfig(configurations.compileClasspath) + fromConfig(configurations.runtimeClasspath)

		def manifest = [:]
		trackedOssCoordinates.each { slug, ga -> manifest[slug] = resolved[ga] ?: 'UNRESOLVED' }
		// The Spring Boot plugin version itself isn't queryable through a stable public Gradle
		// API — but "org.springframework.boot:spring-boot" is managed by that exact same
		// BOM/plugin version, so its already-resolved value IS the Spring Boot version.
		manifest.springBootBomVersion = manifest.springBoot

		manifest.alpine = alpineVersion
		manifest.alpineCollapse = alpineVersion
		manifest.htmx = htmxVersion
		manifest.chartjs = chartJsVersion
		manifest.tailwind = tailwindVersion

		def unresolved = manifest.findAll { k, v -> v == 'UNRESOLVED' }
		if (unresolved) {
			logger.warn("[generateOssManifest] Unresolved coordinates (check trackedOssCoordinates): ${unresolved.keySet()}")
		}

		def f = outputFile.get().asFile
		f.parentFile.mkdirs()
		f.text = groovy.json.JsonOutput.toJson(manifest)
	}
}

processResources.dependsOn 'generateOssManifest'
tasks.named('processResources') {
	from(tasks.named('generateOssManifest'))
}

// ### section title in THIRD_PARTY_LICENSES.md -> which manifest key drives its **Version:**
// line, and whether that line is a literal version or a "Managed by <project> X.Y.Z" phrase
// (only the trailing version token is rewritten in the phrase case — see
// syncThirdPartyLicenseVersions below). Sections not listed here (e.g. Qwen3-1.7B, which has
// its own redistribution-notice lifecycle) are left completely untouched.
ext.thirdPartyVersionSections = [
